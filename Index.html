<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <style>
    :root {
      /* A touch of purple; zone colors mark the pinned sections. */
      --bg: #f3f1f7;
      --card: #ffffff;
      --section: #ebe8f2;
      --text: #26232e;
      --muted: #74707f;
      --border: #dcd7e6;
      --soft: #e7e3ef;
      --z-today: hsl(268 45% 56%);
      --z-suggest: hsl(248 40% 58%);
      --z-next: hsl(290 22% 60%);
      /* Heat tones are kept low-saturation so the list isn't shouty. */
      --heat-sat: 32%;
      --heat-light: 58%;
      --tint: 0%;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #13111a;
        --card: #1f1b28;
        --section: #18151f;
        --text: #ecebf3;
        --muted: #a29eb2;
        --border: #342f42;
        --soft: #2a2537;
        --z-today: hsl(268 50% 66%);
        --z-suggest: hsl(248 45% 68%);
        --z-next: hsl(290 25% 66%);
        --heat-sat: 28%;
        --heat-light: 52%;
        --tint: 0%;
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0 auto;
      padding: 0 12px 32px;
      background: var(--bg);
      color: var(--text);
      max-width: 640px;
      -webkit-text-size-adjust: 100%;
    }

    @media (min-width: 900px) {
      body { max-width: 1200px; padding: 0 16px 32px; }
    }

    /* Header + view buttons stay pinned while scrolling on the phone. */
    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      padding: 10px 0 8px;
      margin-bottom: 4px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 { font-size: 18px; margin: 0; flex: 0 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .refresh-btn {
      flex: 0 0 auto; margin-right: auto;
      width: 30px; height: 30px; padding: 0; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      font-size: 16px; line-height: 1; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    }
    .refresh-btn.spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #status { color: var(--muted); font-size: 12px; text-align: right; }

    .view-tabs { display: flex; gap: 4px; flex-shrink: 0; }
    .view-tabs .notes-btn { padding: 5px 9px; }
    header .notes-btn.active { background: var(--z-today); border-color: var(--z-today); color: #fff; }
    header .notes-btn {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font-size: 13px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-top: 8px;
      padding: 3px;
      background: var(--soft);
      border-radius: 10px;
    }

    .controls button {
      padding: 8px 2px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      font-size: 13px;
      white-space: nowrap;
    }

    .controls button.active {
      background: color-mix(in srgb, var(--z-today) 28%, var(--card));
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
    }

    /* Pick view: compact rows, no jump buttons. */
    body.pick-view .controls, body.today-view .controls { display: none; }
    .pv-row { min-height: 40px; cursor: default; }
    .pv-row .quick.compact { display: flex; gap: 4px; }
    .pv-row .quick.compact .quick.compact { margin: 0; }
    .legend.wide { grid-column: 1 / -1; margin: -12px 2px 0; }
    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }

    .legend .bar {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right,
        hsl(0 var(--heat-sat) var(--heat-light)),
        hsl(35 var(--heat-sat) var(--heat-light)),
        hsl(60 var(--heat-sat) var(--heat-light)),
        hsl(120 var(--heat-sat) var(--heat-light)));
    }

    #groups {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
      align-items: start;
    }

    @media (min-width: 900px) {
      #groups { grid-template-columns: 1fr 1fr; }
      #groups .section.wide { grid-column: 1 / -1; }
    }

    /* ---------- Sections and exercise cards ---------- */

    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
    }

    .section-name { font-size: 15px; font-weight: 700; }
    .section-count { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .sub {
      display: flex;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--soft);
      border-top: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .ex {
      --accent: hsl(var(--hue) var(--heat-sat) var(--heat-light));
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 10px;
      padding: 10px 12px 10px 10px;
      border-top: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      background: var(--card);
    }

    .ex.done { opacity: 0.75; }

    .ex-name { font-size: 15px; font-weight: 600; line-height: 1.25; display: flex; align-items: center; gap: 10px; }
    .ex-name .pick { display: flex; align-items: center; gap: 8px; }
    /* Exercise picture: small square left of the name; tap for start/end. */
    .thumb {
      flex: 0 0 auto; width: 40px; height: 40px; border-radius: 8px; overflow: hidden;
      background: var(--soft); border: 1px solid var(--border); cursor: zoom-in;
    }
    .pick-row .thumb { width: 32px; height: 32px; border-radius: 6px; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb.drawn img { object-fit: contain; }
    .thumb.none { cursor: default; border-style: dashed; background: transparent; }
    .pic-shade {
      position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / 0.55);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .pic-card { background: var(--card); color: var(--text); border-radius: 12px; padding: 12px; max-width: 520px; width: 100%; }
    .pic-title { font-weight: 600; margin-bottom: 8px; }
    .pic-row { display: flex; gap: 8px; }
    .pic-row figure { margin: 0; flex: 1; min-width: 0; }
    .pic-row img { width: 100%; border-radius: 8px; display: block; background: #fff; }
    .pic-row figcaption { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }
    .ex-meta { font-size: 12px; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; grid-column: 1 / -1; }
    .ex-note { font-size: 12px; font-style: italic; color: var(--muted); grid-column: 1 / -1; }

    .tag {
      display: inline-block;
      padding: 0 6px;
      margin: 2px 4px 0 0;
      border-radius: 4px;
      background: var(--soft);
      font-size: 11px;
      color: var(--text);
    }

    /* Facts block: one row each for Last, This wk, Prev, Prev 2 —
       labels in a fixed left column so values line up. */
    .facts {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 2px 10px;
      margin-top: 6px;
      padding: 6px 8px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--card) 70%, transparent);
      font-size: 12px;
      line-height: 1.35;
    }
    .facts dt { color: var(--muted); font-weight: 600; }
    .facts dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
    .facts .sep { color: var(--muted); padding: 0 4px; }
    .dots { letter-spacing: 1px; color: var(--accent); }
    .dots-n { color: var(--muted); margin-left: 6px; }

    .pill {
      align-self: start;
      min-width: 58px;
      text-align: center;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .log {
      grid-column: 1 / -1;
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .log input {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 10px;
      font-size: 16px; /* 16px stops iPhone zooming in on focus */
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
    }

    .log input.weight { flex: 0 0 7.5em; }

    .log button {
      height: 40px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid color-mix(in srgb, var(--accent) 60%, var(--text));
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
    }

    .log button:disabled { opacity: 0.5; }

    /* Focus table: today's plan pinned above every list. */
    /* Each section is a tinted frame; blocks inside it (.grp) are their own
       rounded boxes with space around them. Pinned zones get their own
       purple shade on the border, header and a left stripe. */
    .section { --zone: var(--muted); background: var(--section); }
    .section.focus { --zone: var(--z-today); }
    .section.suggest { --zone: var(--z-suggest); }
    .section.upnext { --zone: var(--z-next); }
    .section.focus, .section.suggest, .section.upnext {
      border: 1.5px solid color-mix(in srgb, var(--zone) 70%, var(--border));
      background: color-mix(in srgb, var(--zone) 6%, var(--section));
    }
    /* Section headers stick under the top bar, so mid-scroll you always
       see which section you're in. --top-h is set from the bar's height. */
    .section-head {
      position: sticky; top: var(--top-h, 180px); z-index: 3;
      background: var(--section); border-radius: 11px 11px 0 0;
      box-shadow: inset 4px 0 0 var(--zone), 0 1px 0 var(--border);
    }
    .section.focus .section-head, .section.suggest .section-head, .section.upnext .section-head {
      background: color-mix(in srgb, var(--zone) 24%, var(--card));
    }
    .section.focus .section-name, .section.suggest .section-name, .section.upnext .section-name { font-size: 16px; }
    .section.summary { --zone: var(--z-next); }
    .section.why .sum-line .key:empty { display: none; }
    .section.why .sum-line .key:empty + .sum-body { margin-top: 0; }
    .section.why .sub { gap: 8px; }
    .section.why .sub .sub-rest { font-size: 11.5px; text-align: right; }
    .section.summary .chev { font-size: 11px; color: var(--muted); }
    .sum-line { margin: 0; padding: 8px 12px; font-size: 14px; line-height: 1.45; border-top: 1px solid var(--border); }
    /* Main idea first: bold + underlined, details muted underneath. */
    .key {
      font-weight: 700; color: var(--text);
      text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px;
      text-decoration-color: color-mix(in srgb, var(--zone) 70%, var(--text));
    }
    .sum-line .key { font-size: 15px; }
    .sum-body { margin-top: 4px; color: var(--muted); font-size: 13.5px; }
    .sub-rest { font-weight: 500; color: var(--muted); }
    /* Suggested category headings: underlined only, not bold. */
    .section.suggest .sub.sug-sub, .section.suggest .sub .key { font-weight: 500; }

    /* Streamlined: This week + Suggested are one flat panel — no boxes
       inside the box. Blocks are split by a label and a thin rule. */
    .section.summary .grp, .section.suggest .grp {
      margin: 0; border: 0; border-radius: 0; overflow: visible; background: transparent;
      border-top: 1px solid var(--border);
    }
    .section.summary .grp > .sub, .section.suggest .grp > .sub {
      background: transparent; box-shadow: none; padding: 12px 12px 4px;
      font-size: 12px; color: var(--text);
    }
    .section.summary .grp > .sub + .sum-line { padding-top: 4px; }
    .section.summary .sum-line + .sum-line { border-top: 0; padding-top: 6px; }
    .section.suggest .grp > .ex, .section.suggest .grp > .pick-row { background: transparent; border-top: 0; }
    .section.suggest .grp > .ex + .ex, .section.suggest .grp > .pick-row + .pick-row {
      border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
    }
    .section.suggest .facts { background: none; padding: 2px 0 0; border-radius: 0; }
    .section.suggest .log input, .section.suggest .log button { background: var(--card); }
    .grp > .sub + .sum-line { border-top: 0; }
    .grp {
      margin: 8px; border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; background: var(--card);
    }
    .grp > .sub { border-top: 0; background: var(--soft); color: var(--text); }
    .grp > .sub:first-child { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--zone) 60%, var(--border)); }
    .section > .ex, .section > .pick-row { border-top: 1px solid var(--border); }
    .empty.small { padding: 14px 12px; font-size: 13px; text-align: left; }
    .zone {
      display: flex; align-items: center; gap: 10px; margin-top: 14px;
      font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text);
    }
    .zone::before, .zone::after { content: ''; flex: 1; height: 2px; border-radius: 1px; background: color-mix(in srgb, var(--z-today) 45%, var(--border)); }
    .zone::before { flex: 0 0 12px; }
    .sort-toggle { display: flex; gap: 2px; padding: 2px; background: var(--soft); border-radius: 8px; order: 3; }
    .zone::after { order: 2; }
    .sort-toggle button {
      padding: 4px 10px; border: 0; border-radius: 6px; background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0;
    }
    .sort-toggle button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
    .ex-meta .add-today { margin-left: 0; }
    .ex-meta .add-today:disabled { opacity: 0.6; }

    /* Suggested — today: picked from rested body areas. */
    .section.suggest .section-head { cursor: pointer; font-weight: 700; }
    .sug-sub { font-weight: 700; }
    .rest-line .jump {
      margin: 2px 4px 2px 0; padding: 2px 9px; font-size: 12px;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--card); color: var(--text); text-align: left;
    }
    .section.suggest .chev { font-size: 11px; margin-left: 6px; }
    .rest-line {
      padding: 6px 12px; font-size: 12px; color: var(--muted);
      border-top: 1px solid var(--border); line-height: 1.4;
    }
    .due-line { color: var(--text); }
    .due-line b { font-weight: 600; }
    .rest-line .unmapped { color: hsl(35 60% 42%); }
    .tag.area { background: var(--soft); }
    .tag.other { outline: 1px dashed hsl(35 60% 50%); }

    /* Recovery days editor (inside Suggested). */
    .rest-edit-btn {
      margin-left: 6px; padding: 1px 8px; font-size: 12px;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--card); color: var(--text);
    }
    .section.suggest.collapsed .rest-edit { display: none; }
    .rest-edit { padding: 8px 12px 10px; border-top: 1px solid var(--border); font-size: 14px; }
    .rest-edit .hint { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    .rest-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    .rest-row .rest-name { flex: 1; }
    .rest-row .rest-def { font-size: 11px; color: var(--muted); min-width: 5.5em; text-align: right; }
    .rest-row button, .rest-actions button {
      min-width: 34px; height: 32px; padding: 0 10px; font-size: 15px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--card); color: var(--text);
    }
    .rest-row .rest-val { min-width: 2.6em; text-align: center; font-weight: 600; }
    .rest-row.changed .rest-val { color: var(--accent); }
    .rest-actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .rest-actions .rest-msg { font-size: 12px; color: var(--muted); }

    /* ---------- Picking (Suggested → Today / Up next) ---------- */
    .pick { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
    .pick-cb { width: 20px; height: 20px; margin: 0; flex: 0 0 auto; accent-color: var(--z-today); opacity: 0.85; }
    .pick .pick-cb { margin-top: 1px; }
    .ex.sel { box-shadow: inset 0 0 0 2px var(--text); }
    .pick-row {
      --accent: hsl(var(--hue) var(--heat-sat) var(--heat-light));
      display: flex; align-items: center; gap: 10px;
      min-height: 44px; padding: 6px 12px 6px 10px;
      border-top: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      background: var(--card);
      font-size: 14px; cursor: pointer;
    }
    .pick-row.sel { background: color-mix(in srgb, var(--text) 10%, var(--card)); }
    .pick-row.done { opacity: 0.55; }
    .pick-row .pr-name { flex: 1; font-weight: 600; min-width: 0; text-align: left; }
    .pick-row .pr-meta { font-size: 12px; color: var(--muted); text-align: right; }
    .pr-name.link { border: 0; background: none; color: var(--text); font: inherit; font-weight: 600; padding: 0; }
    .mini {
      padding: 2px 9px; font-size: 12px; margin-left: 2px;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--card); color: var(--text);
    }
    .ex-meta .mini { margin: 2px 4px 0 0; }
    .hint-line { font-style: italic; }
    .sub.pt-head { color: var(--text); }
    .tag.later { outline: 1px dashed var(--muted); }
    .next-row { cursor: default; }
    #pick-bar {
      position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 8;
      display: flex; align-items: center; gap: 8px;
      width: min(616px, calc(100vw - 24px));
      padding: 8px 10px; border-radius: 12px;
      background: var(--text); color: var(--bg);
      box-shadow: 0 4px 16px rgb(0 0 0 / 0.25);
    }
    #pick-bar[hidden] { display: none; }
    #pick-bar .pb-count { flex: 1; font-size: 14px; font-weight: 600; }
    #pick-bar button {
      height: 38px; padding: 0 12px; font-size: 14px; font-weight: 600;
      border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); border-radius: 8px;
      background: transparent; color: var(--bg);
    }
    #pick-bar button.primary { background: var(--bg); color: var(--text); }
    body.picking { padding-bottom: 80px; }

    .empty { color: var(--muted); text-align: center; padding: 24px 0; grid-column: 1 / -1; }

    /* ---------- Notes side panel ---------- */
    #notes-shade {
      position: fixed; inset: 0; z-index: 10; background: rgb(0 0 0 / 0.3);
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    #notes-panel {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 11;
      width: min(360px, 88vw);
      background: var(--card); color: var(--text);
      border-left: 1px solid var(--border);
      padding: 16px; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.2s;
      display: flex; flex-direction: column; gap: 10px;
    }
    body.notes-open #notes-shade { opacity: 1; pointer-events: auto; }
    body.notes-open #notes-panel { transform: none; }
    #notes-panel .panel-head { display: flex; justify-content: space-between; align-items: center; }
    #notes-panel h2 { font-size: 17px; margin: 0; }
    #notes-panel textarea {
      width: 100%; min-height: 70px; padding: 8px;
      font: inherit; font-size: 16px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text);
    }
    #notes-panel button {
      padding: 6px 12px; font-size: 14px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--card); color: var(--text);
    }
    #notes-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    #notes-list li {
      display: flex; gap: 8px; align-items: flex-start;
      padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
    }
    #notes-list li span { flex: 1; overflow-wrap: anywhere; }
    #notes-list li button { padding: 0 8px; }
    #notes-status { font-size: 12px; color: var(--muted); }

    /* ---------- PT this week: pinned checklist strip ---------- */
    #pt-strip { margin-top: 8px; }
    #pt-strip:empty { display: none; }
    .pt-line {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600;
    }
    .pt-line .pt-label { white-space: nowrap; min-width: 6.8em; }
    .pt-line .pt-count { white-space: nowrap; color: var(--muted); font-weight: 500; }
    /* Segmented bars: one box per exercise. */
    .seg-bar { flex: 1; display: flex; gap: 2px; min-width: 0; }
    .seg {
      --fill: hsl(120 var(--heat-sat) var(--heat-light));
      flex: 1; min-width: 2px; height: 9px;
      border-radius: 2px;
      background: var(--soft);
      box-shadow: inset 0 0 0 1px var(--border);
      overflow: hidden;
    }
    .seg.full { background: var(--fill); box-shadow: none; }
    .seg i { display: block; height: 100%; background: hsl(40 65% 60%); }
    .seg-bar.all .seg { --fill: hsl(140 55% 42%); }
    .seg-bar.blue .seg { --fill: var(--muted); height: 7px; }
    .wk-days { font-weight: 600; }
    .pt-count .started { color: hsl(35 60% 42%); }
    @media (prefers-color-scheme: dark) { .pt-count .started { color: hsl(40 65% 62%); } }
    /* Bonus line: same shape, quieter — optional, not a to-do. */
    .pt-line.bonus { margin-top: 6px; font-weight: 500; color: var(--muted); }
    /* Per muscle group breakdown under the PT total: two columns of mini bars. */
    .pt-groups {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px;
      margin-top: 6px; font-size: 11px; color: var(--muted);
    }
    .pt-grp {
      display: flex; align-items: center; gap: 6px; min-width: 0;
      font: inherit; color: inherit; text-align: left;
      background: transparent; border: 1px solid transparent; border-radius: 6px;
      padding: 3px 4px; margin: -3px -4px; cursor: pointer;
    }
    .pt-grp.solo { grid-column: 1 / -1; }
    .pt-grp-name { display: flex; align-items: center; gap: 5px; }
    /* Freshness dots: red = just done, yellow = ready, green = falling behind. */
    .fdot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .fdot.f-red { background: hsl(0 65% 55%); }
    .fdot.f-yellow { background: hsl(44 85% 52%); }
    .fdot.f-green { background: hsl(135 50% 42%); }
    /* Done-session boxes in a group take that group's dot color (Julius, 2026-10-25). */
    .pt-grp.f-red .seg.full { background: hsl(0 65% 55%); }
    .pt-grp.f-yellow .seg.full { background: hsl(44 85% 52%); }
    .pt-grp.f-green .seg.full { background: hsl(135 50% 42%); }
    .pt-grp.f-green:not(.met) .pt-grp-name { color: var(--text); font-weight: 600; }
    .pt-grp.f-red .pt-grp-name { opacity: 0.8; }
    .fresh-key { display: flex; gap: 12px; margin-top: 5px; font-size: 10.5px; color: var(--muted); }
    .fresh-key span { display: flex; align-items: center; gap: 4px; }
    .grid-tabs { display: flex; gap: 4px; margin-bottom: 6px; }
    .grid-tab {
      font: inherit; font-size: 11.5px; padding: 3px 9px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      display: flex; gap: 5px; align-items: center;
    }
    .grid-tab.active { background: var(--soft); color: var(--text); font-weight: 600; border-color: var(--muted); }
    .grid-tab-n { font-variant-numeric: tabular-nums; opacity: 0.8; }
    .pt-total {
      width: 100%; font: inherit; font-size: 12px; font-weight: 600; color: inherit; text-align: left;
      background: transparent; border: 1px solid transparent; border-radius: 6px;
      padding: 3px 4px; margin: -3px -4px; cursor: pointer; box-sizing: border-box; width: calc(100% + 8px);
    }
    .pt-total.open { border-color: var(--border); background: var(--soft); }
    .pt-detail-sub { display: flex; align-items: center; gap: 5px; }
    .pt-detail-row .fdot { margin-right: 2px; }
    .pt-detail-row .thumb { width: 30px; height: 30px; border-radius: 6px; }
    .pt-detail-text { flex: 1; }
    .pt-grp.open { border-color: var(--border); background: var(--soft); }
    .pt-grp-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 6.2em; flex-shrink: 0; }
    .pt-grp .seg { height: 7px; }
    .seg-bar.clusters { gap: 5px; }
    .seg-cluster { flex: var(--n, 1); display: flex; gap: 1px; min-width: 0; }
    .seg-cluster .seg { flex: 1; }
    .pt-grp-n { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .pt-grp.partial .pt-grp-name { color: var(--text); }
    .pt-grp.met { opacity: 0.7; }
    /* Labeled grid (2026-10-26): group head, then one line per exercise —
       short name on the left, its session cells on the right. */
    .pt-grp.labeled { flex-direction: column; align-items: stretch; gap: 3px; }
    .pt-grp.labeled .pt-grp-head { display: flex; align-items: center; gap: 6px; }
    .pt-grp.labeled .pt-grp-name {
      width: auto; flex: 1; min-width: 0;
      font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .gx { display: flex; align-items: center; gap: 6px; }
    .gx-name {
      flex: 1; min-width: 0; font-size: 11.5px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .gx.met .gx-name { color: var(--muted); }
    .gx-cells { display: flex; gap: 2px; flex: 0 0 auto; }
    .gx-cells .seg { flex: 0 0 14px; height: 8px; }
    /* In Today, not done yet (2026-10-26, Julius): purple = Today's color, kept apart
       from the red/yellow/green freshness fills. The next empty cell is filled light
       purple with a purple ring; already at goal → ring on the last cell. */
    .gx-cells .seg.plan { background: hsl(268 70% 85%); box-shadow: inset 0 0 0 1.5px var(--z-today); }
    .gx-cells .seg.full.plan { box-shadow: 0 0 0 1.5px var(--z-today); }
    @media (prefers-color-scheme: dark) { .gx-cells .seg.plan:not(.full) { background: hsl(268 40% 38%); } }
    .gx.planned .gx-name { color: var(--z-today); font-weight: 600; }
    /* Compact grid (2026-10-26, Julius: too much empty space): names sit in one
       fixed-width column so every exercise's cells start right after its name
       and line up across all groups; groups are sized to their content. */
    /* Fill the width (2026-10-26, Julius: right side empty on phone, all crammed
       left on tablet): as many equal columns as fit — 3 on a phone, more on a
       tablet. No full-row solo groups here, so nothing leaves a gap. */
    .pt-groups { grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); column-gap: 10px; row-gap: 8px; }
    .pt-grp.solo { grid-column: auto; }
    .pt-grp.labeled { align-items: stretch; }
    .pt-grp.labeled .pt-grp-head { gap: 6px; }
    .pt-grp.labeled .pt-grp-name { flex: 0 1 auto; }
    .gx-name { flex: 0 0 5.4em; }
    .pt-detail {
      margin-top: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); font-size: 13px;
    }
    .pt-detail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pt-detail-title { font-weight: 600; }
    .pt-detail-sub { margin-top: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .pt-detail-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; }
    .pt-detail-row + .pt-detail-row { border-top: 1px solid var(--border); }
    .pt-detail-row.met { color: var(--muted); }
    .pt-detail-text { display: flex; flex-direction: column; min-width: 0; }
    .pt-detail-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pt-detail-meta { font-size: 11.5px; color: var(--muted); }
    .pt-detail-why { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.4; }
    .pt-chips {
      display: flex; gap: 6px; margin-top: 6px;
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .pt-chips::-webkit-scrollbar { display: none; }
    .pt-chips-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .pt-chips-row .pt-chips { margin-top: 0; flex: 1; min-width: 0; }
    .pt-chips-label { flex: 0 0 auto; font-size: 11px; font-weight: 600; color: var(--muted); line-height: 1.15; }
    .pt-detail-row.flash { animation: flash 1.2s ease-out; border-radius: 6px; }
    .chip {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 4px;
      max-width: 11em;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
    }
    .chip .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip .chip-n { font-size: 11px; color: var(--muted); }
    .chip.partial { border-color: var(--muted); }
    .chip.met { border-color: transparent; background: var(--soft); color: var(--muted); }

    /* PT cards: met ones get a check and step back so what's left stands out. */
    .ex.met .ex-name > :last-child::before { content: '✓ '; color: hsl(130 45% 40%); }
    .ex.met:not(.done) { opacity: 0.7; }
    .ex { scroll-margin-top: calc(var(--top-h, 180px) + 56px); }
    .ex.flash { animation: flash 1.2s ease-out; }
    @keyframes flash { from { box-shadow: inset 0 0 0 2px var(--text); } to { box-shadow: inset 0 0 0 2px transparent; } }

    /* ================= Streamlined look (2026-10-25) =================
       One level of rounding: each section is a single rounded panel.
       Everything inside is flat — rows split by hairlines, groups by a
       small label, details as plain text instead of chips/boxes. */
    .section, .section.focus, .section.suggest, .section.upnext {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
    }
    .section.focus, .section.suggest, .section.upnext { border-top: 3px solid var(--zone); }
    .section-head, .section.focus .section-head, .section.suggest .section-head, .section.upnext .section-head {
      background: var(--card); box-shadow: 0 1px 0 var(--border); border-radius: 13px 13px 0 0; padding: 12px 14px;
    }
    .section .grp, .section.summary .grp, .section.suggest .grp {
      margin: 0; border: 0; border-radius: 0; overflow: visible; background: transparent;
    }
    .section .grp + .grp, .section .rest-line + .grp { border-top: 1px solid var(--border); }
    .section .grp > .sub, .section .sub {
      background: transparent; box-shadow: none; border-top: 0;
      padding: 14px 14px 4px; font-size: 11.5px; color: var(--muted);
    }
    .section .grp > .ex, .section .grp > .pick-row, .section > .ex, .section > .pick-row {
      background: transparent; border-top: 0;
    }
    .section .grp > .ex + .ex, .section .grp > .pick-row + .pick-row,
    .section > .ex + .ex, .section > .pick-row + .pick-row {
      border-top: 1px solid color-mix(in srgb, var(--border) 65%, transparent);
    }
    .ex { padding: 12px 14px 12px 12px; border-left-width: 3px; }
    .pick-row { padding: 6px 10px 6px 12px; }
    .rest-line { padding: 8px 14px; border-top: 0; }
    .sum-line { padding: 6px 14px; border-top: 0; }

    /* Details as quiet text, not boxes. */
    .facts, .section.suggest .facts { background: none; padding: 0; border-radius: 0; margin-top: 6px; }
    .tag, .tag.area {
      background: none; padding: 0; margin: 0; border-radius: 0; outline: 0;
      font-size: 12px; color: var(--muted);
    }
    .tag + .tag::before { content: '·'; padding: 0 6px; color: var(--muted); }
    .tag.area { color: var(--text); font-weight: 600; }
    .tag.later { color: hsl(35 55% 42%); }
    .tag.other { color: hsl(35 60% 42%); }
    .pill { background: none; border: 0; padding: 2px 0; min-width: 0; color: var(--muted); font-weight: 600; }
    .mini, .rest-edit-btn, .rest-line .jump { border-radius: 8px; }

    /* One-tap Today / Next. */
    /* This week: headlines keep the underline but stay quiet like the text;
       a clear rule splits Going well from Suggestions. */
    .sum-line .key {
      font-size: 14px; font-weight: 500; color: var(--muted);
      text-decoration-thickness: 1px; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent);
    }
    .section.summary .grp { padding-bottom: 6px; }
    .section.summary .grp + .grp {
      border-top: 2px solid color-mix(in srgb, var(--zone) 50%, var(--border));
      margin-top: 4px;
    }
    .quick { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 8px; }
    .q-btn {
      height: 32px; padding: 0 12px; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border); border-radius: 8px;
      background: transparent; color: var(--text);
    }
    .q-btn.on {
      border-color: transparent;
      background: color-mix(in srgb, var(--z-today) 18%, var(--card)); color: var(--text);
    }
    .q-btn:disabled { opacity: 0.7; }
    .quick.compact { margin: 0 0 0 auto; flex: 0 0 auto; gap: 4px; }
    .quick.compact .q-btn { height: 30px; padding: 0 9px; font-size: 12px; }
    .pick-row .pr-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .pick-row .pr-meta { text-align: left; }

    /* Card layout: details on the left, days + quick buttons stacked on
       the right so the card is balanced; log box spans the full width. */
    .ex { grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; }
    .ex > .ex-name, .ex > .ex-meta, .ex > .facts { grid-column: 1; }
    .ex > .side {
      grid-column: 2; grid-row: 1 / span 3; align-self: start;
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    }
    .ex > .ex-note, .ex > .log { grid-column: 1 / -1; }
    .ex .side .pill { padding: 0; line-height: 1.25; }
    .ex .side .quick { flex-direction: column; align-items: stretch; gap: 4px; margin: 0; }
    /* Space-efficient cards (Julius, 2026-10-25): less left padding, smaller
       picture; Next / ✕ live in the right column under the days. */
    .ex { padding: 10px 12px 10px 8px; column-gap: 10px; }
    .ex .thumb { width: 34px; height: 34px; border-radius: 7px; }
    .ex-name { gap: 8px; }
    .facts { column-gap: 8px; }

    /* Smaller quick buttons. */
    .q-btn { height: 26px; padding: 0 8px; font-size: 12px; font-weight: 600; border-radius: 6px; white-space: nowrap; }
    .quick.compact .q-btn { height: 26px; padding: 0 7px; font-size: 11.5px; }
    /* Suggested tree (2026-10-25): category heading, then indented area groups. */
    .cat-head {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 10px 14px 2px; font-size: 12px; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted);
    }
    .cat-head .cat-name { font-weight: 700; color: var(--text); }
    .cat-head .cat-rest { text-transform: none; letter-spacing: 0; }
    .cat-head .cat-count { text-transform: none; letter-spacing: 0; }
    .section.suggest .grp { margin-left: 12px; border-left: 2px solid var(--border); }

    /* Options (⋯ top right) and the PT spread block (2026-10-26). */
    .opt-btn { margin-right: 0; font-weight: 700; }
    .opt-panel {
      position: absolute; right: 0; top: 46px; z-index: 20;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); font-size: 14px;
    }
    .opt-panel[hidden] { display: none; }
    .opt-row { display: flex; align-items: center; gap: 8px; }
    .opt-row .opt-name { margin-right: 6px; }
    .opt-row button {
      min-width: 32px; height: 30px; font-size: 15px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text);
    }
    .opt-row #spread-n { min-width: 1.4em; text-align: center; font-weight: 700; }
    .spread { margin: 2px 0 8px; }
    .opt-row .opt-mode { padding: 3px 8px; }
    .opt-row .opt-mode.on { background: var(--z-today, #5b3fa0); color: #fff; border-color: transparent; }
    .spread-row .sp-pos { flex: 0 0 auto; min-width: 1.6em; font-size: 12px; font-weight: 700; color: var(--muted); text-align: right; }
    .spread-row .sp-swap { flex: 0 0 auto; font-size: 11px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--muted); }
    .spread-row.swapped .sp-swap { color: var(--text, inherit); font-weight: 700; }
    .spread-row { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 12px; border-top: 1px solid var(--border); }
    .spread-row.done { opacity: 0.55; }
    .spread-row .thumb { width: 32px; height: 32px; border-radius: 6px; flex: 0 0 auto; }
    .spread-row .sp-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .spread-row .sp-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .spread-row .sp-meta { font-size: 12px; color: var(--muted); }
    .spread-row .quick.compact { display: flex; gap: 4px; margin: 0; }
  </style>
</head>

<body>
  <div class="top">
    <header>
      <h1>Exercise Tracker</h1>
      <a class="refresh-btn" id="refresh-btn" target="_top" role="button" title="Refresh" aria-label="Refresh">↻</a>
      <div id="status">Loading…</div>
      <div class="view-tabs" id="view-tabs">
        <button class="notes-btn" data-view="pick" type="button">Simple</button>
        <button class="notes-btn" data-view="full" type="button">Full</button>
      </div>
      <button class="refresh-btn opt-btn" id="opt-btn" type="button" title="Options" aria-label="Options">⋯</button>
    </header>
    <div class="opt-panel" id="opt-panel" hidden>
      <div class="opt-row">
        <span class="opt-name">PT picks shown</span>
        <button type="button" data-spread="-1" aria-label="Fewer">−</button>
        <span id="spread-n">5</span>
        <button type="button" data-spread="1" aria-label="More">+</button>
      </div>
      <div class="opt-row">
        <span class="opt-name">PT order</span>
        <button type="button" class="opt-mode" data-ptmode="rotation">Rotation</button>
        <button type="button" class="opt-mode" data-ptmode="spread">Spread</button>
      </div>
    </div>

    <div class="controls">
      <button data-jump="today-sec" class="active">Today</button>
      <button data-jump="suggest-sec">Suggested</button>
      <button data-jump="next-sec">Up next</button>
      <button data-jump="all-sec">All</button>
    </div>

    <div id="pt-strip"></div>
  </div>

  <div id="groups"></div>

  <div id="pick-bar" hidden>
    <span class="pb-count">0 selected</span>
    <button type="button" data-to="today" class="primary">Do today</button>
    <button type="button" data-to="next">Up next</button>
    <button type="button" data-to="clear" title="Clear selection">✕</button>
  </div>

  <div id="notes-shade"></div>
  <aside id="notes-panel" aria-label="App notes">
    <div class="panel-head">
      <h2>App notes</h2>
      <button type="button" id="notes-close">Close</button>
    </div>
    <form id="notes-form">
      <textarea id="notes-input" placeholder="Change to make in the app…"></textarea>
      <button type="submit">Add note</button>
    </form>
    <div id="notes-status"></div>
    <ul id="notes-list"></ul>
  </aside>

  <script>
    let data = null;
    let sortMode = 'category';

    const NO_DATE_DAYS = 30; // exercises with no date count as this many days

    // Apps Script turns null into undefined; no date → NO_DATE_DAYS.
    function effectiveDays(n) {
      return (n == null || isNaN(n)) ? NO_DATE_DAYS : n;
    }

    // Hue for the heat color: 0 = just trained (red) → 120 = recovered (green).
    function heatHue(days, recoveryDays) {
      const t = Math.max(0, Math.min(1, days / recoveryDays));
      return Math.round(t * 120);
    }

    function daysLabel(n) {
      if (n === 0) return 'today';
      if (n === 1) return '1 day';
      return n + ' days';
    }

    // Week runs Monday–Sunday.
    function weekStartIso() {
      const [y, m, d] = data.today.split('-').map(Number);
      const t = new Date(y, m - 1, d);
      t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
      return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
    }

    // Per sheet row ("slot").
    const slotThisWeek = s => !s.noDate && s.lastDate >= weekStartIso();
    const slotToday = s => !s.noDate && s.lastDate === data.today;

    // Per merged exercise.
    const isDoneToday = ex => ex.slots.some(slotToday);
    function weekCount(list) {
      const done = list.reduce((n, ex) => n + ex.weekDone, 0);
      const total = list.reduce((n, ex) => n + ex.slots.length, 0);
      return done + ' / ' + total;
    }

    // Weight = the leading part of a log entry when it has letters,
    // e.g. "25lbs, 30, 25" → "25lbs", "20lbx2,  18" → "20lbx2", "thk red. 40" → "thk red".
    function weightOf(entry) {
      const head = String(entry || '').split(/[:,]|\.\s/)[0].trim().replace(/\.$/, '');
      return /[a-z]/i.test(head) ? head : '';
    }

    function baseName(name) {
      return String(name).replace(/[.\s]+$/, '').replace(/\.?\s+\d.*$/, '').trim().toLowerCase();
    }

    // "Side Lying Hip Abduction    2-3x a wk" → name "Side Lying Hip Abduction", freq "2–3×/wk".
    const FREQ_RE = /\s*(\d)\s*(?:-\s*(\d))?\s*x\s*(?:a|\/)\s*wk\.?\s*$/i;
    function splitName(name) {
      const raw = String(name).trim();
      const m = raw.match(FREQ_RE);
      const clean = (m ? raw.slice(0, m.index) : raw).replace(/[.\s]+$/, '').replace(/\s{2,}/g, ' ');
      const freq = m ? (m[2] ? m[1] + '–' + m[2] : m[1]) + '×/wk' : '';
      return { name: clean || raw, freq, freqMin: m ? Number(m[1]) : 0 };
    }

    // Last weight used: newest entry across this exercise's rows, else any
    // row with the same exercise name.
    function lastWeight(ex) {
      const fromRow = list => (list || []).map(weightOf).find(Boolean) || '';
      for (const s of ex.recent) {
        const w = fromRow(s.sets);
        if (w) return w;
      }
      const key = baseName(ex.target.name);
      for (const g of data.groups) for (const other of g.exercises) {
        if (baseName(other.name) === key) {
          const w = fromRow(other.sets);
          if (w) return w;
        }
      }
      return '';
    }

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    // Three top categories; the sheet's Abs section lives under Isolation.
    function categoryOf(section) {
      const s = String(section || '');
      if (/^pt\b/i.test(s)) return 'PT';
      if (/compound/i.test(s)) return 'Compound';
      if (/abs|isolation/i.test(s)) return 'Isolation';
      return s.split(' (')[0] || 'Other';
    }

    // Every sheet row as a flat list, sheet order.
    function sheetRows() {
      const all = [];
      data.groups.forEach(g => g.exercises.forEach(ex =>
        all.push(Object.assign({ group: g.name, area: g.area || 'Other', recoveryDays: g.recoveryDays }, ex, {
          days: effectiveDays(ex.daysSince),
          noDate: ex.daysSince == null,
          category: categoryOf(ex.section),
        }))));
      return all.sort((a, b) => a.row - b.row);
    }

    // Duplicate rows (PT exercises have one row per weekly session) become one
    // exercise. Each row is a "slot"; logging fills the next open slot.
    function mergeDupes(rows) {
      const list = [];
      const byKey = {};
      rows.forEach(r => {
        const key = r.category + '|' + r.group + '|' + baseName(r.name);
        if (!byKey[key]) list.push(byKey[key] = { key, slots: [] });
        byKey[key].slots.push(r);
      });
      return list.map(({ key, slots }) => {
        // Real dates before undated rows: an undated row counts as 30 days for
        // color, which used to beat a real date older than that.
        const recent = slots.slice().sort((a, b) => a.noDate - b.noDate || a.days - b.days || a.row - b.row);
        const latest = recent[0];
        // Already logged today → same row again; otherwise first row not done
        // this week; all done → the oldest one.
        const target = slots.find(slotToday) || slots.find(s => !slotThisWeek(s)) || recent[recent.length - 1];
        const parts = slots.map(s => splitName(s.name));
        const shortest = parts.reduce((a, b) => (b.name.length < a.name.length ? b : a));
        const weekDone = slots.filter(slotThisWeek).length;
        // Weekly goal: the low end of "2-3x a wk", else one per sheet row.
        const weekTarget = Math.min(parts.map(p => p.freqMin).find(Boolean) || slots.length, slots.length) || 1;
        return {
          key, slots, recent, latest, target,
          name: shortest.name,
          freq: parts.map(p => p.freq).find(Boolean) || '',
          group: latest.group,
          area: latest.area,
          category: latest.category,
          recoveryDays: latest.recoveryDays,
          days: latest.days,
          noDate: latest.noDate,
          lastDate: latest.lastDate,
          dateText: latest.dateText,
          firstRow: slots[0].row,
          weekDone,
          weekTarget,
          met: weekDone >= weekTarget,
        };
      });
    }

    // Merged exercises grouped into PT / Compound / Isolation, sheet order.
    function buildSections() {
      const sections = [];
      const byName = {};
      mergeDupes(sheetRows()).forEach(ex => {
        if (!byName[ex.category]) sections.push(byName[ex.category] = { name: ex.category, exercises: [] });
        byName[ex.category].exercises.push(ex);
      });
      return sections;
    }

    // Weight + sets, tap Log. Writes to the target row (next open slot).
    function logBox(ex) {
      const form = el('form', 'log');
      const weight = el('input', 'weight');
      weight.placeholder = 'Weight / band';
      weight.value = (ex.plan && ex.plan.weight) || lastWeight(ex);
      const input = el('input');
      input.placeholder = 'Reps: 20, 20';
      input.enterKeyHint = 'done';
      input.inputMode = 'text';
      const btn = el('button', '', 'Log');
      btn.type = 'submit';
      form.append(weight, input, btn);
      form.addEventListener('submit', e => {
        e.preventDefault();
        let w = weight.value.trim();
        if (/^\d+(\.\d+)?$/.test(w)) w += 'lbs'; // plain number → pounds
        // Reps per set, tidied to "20, 20" (commas or spaces both work).
        const sets = input.value.split(/[\s,]+/).filter(Boolean).join(', ');
        // "25lbs: 20, 20" — weight/band, colon, then reps per set (Julius, 2026-10-25).
        const entry = sets ? (w ? w + ': ' + sets : sets) : '';
        if (!entry && !confirm('Mark "' + ex.name + '" done today with no sets?')) return;
        btn.disabled = true;
        btn.textContent = '…';
        setStatus('Saving ' + ex.name + '…');
        google.script.run
          .withSuccessHandler(result => {
            data = result;
            render();
            setStatus('Logged ' + ex.name);
          })
          .withFailureHandler(err => {
            btn.disabled = false;
            btn.textContent = 'Log';
            setStatus('Error: ' + err.message);
          })
          .logExercise(ex.target.row, ex.target.name, entry);
      });
      return form;
    }

    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    // "2026-10-26" → "M". Su M T W Th F Sa.
    const DAY_ABBR = ['Su', 'M', 'T', 'W', 'Th', 'F', 'Sa'];
    function dayAbbr(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return DAY_ABBR[new Date(y, m - 1, d).getDay()];
    }

    // Segmented bar: one box per item. cells = fill amounts 0..1, filled first.
    function segBar(cells, cls) {
      const bar = el('div', 'seg-bar' + (cls ? ' ' + cls : ''));
      cells.slice().sort((a, b) => b - a).forEach(v => {
        const seg = el('span', 'seg' + (v >= 1 ? ' full' : v > 0 ? ' part' : ''));
        if (v > 0 && v < 1) {
          const i = el('i');
          i.style.width = Math.round(v * 100) + '%';
          seg.append(i);
        }
        bar.append(seg);
      });
      return bar;
    }

    const cleanEntry = s => String(s || '').replace(/\s+/g, ' ').replace(/[,.\s]+$/, '');

    // Facts block, one labelled row each:
    //   Last     10/22 Thurs · Oct wk 4 of 5
    //   This wk  ●●○  2 of 3
    //   Prev     light band, 20,20
    //   Prev 2   light band, 15,15
    function historyLine(ex) {
      const facts = el('dl', 'facts');
      const row = (label, ...values) => {
        const dd = el('dd');
        dd.append(...values);
        facts.append(el('dt', '', label), dd);
      };

      const text = String(ex.dateText || '');
      const [datePart, ...rest] = text.split('|').map(t => t.trim());
      const extra = rest.join(' | ');
      const wk = extra.match(/^wk\s*(\d)\s*\/\s*(\d)$/i);
      if (!ex.noDate) {
        const parts = [document.createTextNode(datePart)];
        if (wk) parts.push(el('span', 'sep', '·'), document.createTextNode(MONTHS[Number(ex.lastDate.slice(5, 7)) - 1] + ' wk ' + wk[1] + ' of ' + wk[2]));
        else if (extra && extra !== 'i') parts.push(el('span', 'sep', '·'), document.createTextNode(extra));
        row('Last', ...parts);
      } else if (text.trim() && text.trim() !== 'i') {
        row('Note', document.createTextNode(text.trim()));
      }

      if (ex.slots.length > 1 || ex.category === 'PT') {
        // One dot per session in the weekly goal (more if he went over).
        const n = Math.max(ex.weekTarget, ex.weekDone);
        const days = ex.slots.filter(slotThisWeek).map(s => s.lastDate).sort().map(dayAbbr);
        const parts = [el('span', 'dots', '●'.repeat(ex.weekDone) + '○'.repeat(n - ex.weekDone)),
          el('span', 'dots-n', ex.weekDone + ' of ' + ex.weekTarget + (ex.met ? ' ✓' : ''))];
        if (days.length) parts.push(el('span', 'sep', '·'), el('span', 'wk-days', days.join(' ')));
        row('This wk', ...parts);
      }

      // One row: its last two logs. Several rows: the newest log of each, newest row first.
      const entries = ex.slots.length > 1
        ? ex.recent.map(s => cleanEntry((s.sets || [])[0])).filter(Boolean)
        : (ex.latest.sets || []).map(cleanEntry).filter(Boolean);
      if (entries[0]) row('Prev', document.createTextNode(entries[0]));
      if (entries[1]) row('Prev 2', document.createTextNode(entries[1]));
      return facts.childNodes.length ? facts : null;
    }

    // Plan from plan.js, matched by row (falls back to name if rows moved).
    // Keeps plan order, but anything already logged today moves to the end.
    // Exercise for a stored { row, name } reference (plan item or pick).
    function findEx(all, p) {
      return all.find(e => e.slots.some(s => s.row === p.row && s.name === p.name))
        || all.find(e => e.slots.some(s => s.name === p.name));
    }

    // Today's picks (chosen in Suggested) join the plan from plan.js.
    function todayPicks() { return (data.picks && data.picks.today) || []; }

    // Up next: kept until logged on a day after it was added (logged today →
    // still shown, dimmed, so it doesn't vanish mid-session).
    function upNextExercises(all) {
      const seen = new Set();
      return ((data.picks && data.picks.next) || []).map(p => {
        const ex = findEx(all, p);
        if (!ex || seen.has(ex.key)) return null;
        seen.add(ex.key);
        const doneSince = ex.slots.some(s => !s.noDate && p.added && s.lastDate >= p.added && s.lastDate < data.today);
        return doneSince ? null : Object.assign({}, ex, { pickRef: p });
      }).filter(Boolean);
    }

    function plannedExercises(sections) {
      const all = [].concat(...sections.map(s => s.exercises));
      const seen = new Set();
      const planned = [];
      (data.plan || []).concat(todayPicks().map(p => Object.assign({ picked: true }, p))).forEach(p => {
        const ex = findEx(all, p);
        if (!ex || seen.has(ex.key)) return;
        seen.add(ex.key);
        planned.push(Object.assign({}, ex, { plan: p }));
      });
      // Anything logged today stays in Today as a record, planned or not.
      all.filter(ex => isDoneToday(ex) && !seen.has(ex.key)).forEach(ex => {
        seen.add(ex.key);
        planned.push(Object.assign({}, ex, { plan: { row: ex.target.row, name: ex.target.name, logged: true } }));
      });
      return planned.filter(ex => !isDoneToday(ex)).concat(planned.filter(isDoneToday));
    }

    // ---------- Suggested exercises ----------
    // Picked "as of this morning": logs dated today are ignored for readiness,
    // so the list doesn't reshuffle as he logs. Done-today items sink and dim.
    // Priority: PT > Compound > Isolation (the sheet's Abs live in Isolation).
    const SHORT_DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    // Real days since this exercise before today, or null if never dated (a row
    // logged today has lost its old date, so it doesn't count).
    function realDaysBeforeToday(ex) {
      const prior = ex.slots.filter(s => !s.noDate && !slotToday(s)).map(s => s.days);
      return prior.length ? Math.min(...prior) : null;
    }
    const daysBeforeToday = ex => effectiveDays(realDaysBeforeToday(ex));

    // Per area: days since anything in it was trained (before today), ready or
    // resting, and the weekday it's ready again.
    function areaStatus(all) {
      const out = {};
      const config = data.areas || [];
      const daysFor = name => (config.find(a => a.name === name) || { days: 2 }).days;
      all.forEach(ex => {
        const a = out[ex.area] || (out[ex.area] = { name: ex.area, days: daysFor(ex.area), since: null });
        const d = realDaysBeforeToday(ex);
        if (d != null && (a.since == null || d < a.since)) a.since = d;
      });
      const [y, m, d] = data.today.split('-').map(Number);
      Object.values(out).forEach(a => {
        a.ready = a.since == null || a.since >= a.days;
        const until = new Date(y, m - 1, d + (a.days - a.since));
        a.until = a.days - a.since === 1 ? 'tomorrow' : SHORT_DAYS[until.getDay()];
      });
      return out;
    }

    // Days since anything in a muscle group (column A) was trained, before
    // today; never-logged groups count as NO_DATE_DAYS.
    function groupStatus(all) {
      const out = {};
      all.forEach(ex => {
        const d = realDaysBeforeToday(ex);
        const g = out[ex.group] || (out[ex.group] = { name: ex.group, since: null });
        if (d != null && (g.since == null || d < g.since)) g.since = d;
      });
      return out;
    }

    // Suggested: PT first — every PT short of its weekly goal, rested ones
    // leading. Then, secondary, the top SUGGEST_AREAS ready areas that have
    // gone longest without training (Arms 80d, Back 38d, …), each with one
    // Compound and one Isolation from its most neglected muscle group.
    const SUGGEST_AREAS = 3;
    const CAT_ORDER = { PT: 0, Compound: 1, Isolation: 2 };

    function suggestedExercises(sections) {
      const all = [].concat(...sections.map(s => s.exercises));
      const areas = areaStatus(all);
      const groups = groupStatus(all);
      const inPlan = new Set(plannedExercises(sections).map(ex => ex.key));
      const ready = ex => areas[ex.area] && areas[ex.area].ready;
      const gap = ex => daysBeforeToday(ex);
      const groupGap = ex => effectiveDays(groups[ex.group].since);
      // Within an area: most neglected muscle group, then longest gap.
      const byNeglect = (a, b) => groupGap(b) - groupGap(a) || gap(b) - gap(a) || a.firstRow - b.firstRow;
      const tag = ex => Object.assign({}, ex, { suggest: areas[ex.area], suggestGroup: groups[ex.group] });
      const byCat = (a, b) => CAT_ORDER[a.category] - CAT_ORDER[b.category];
      const doneLast = list => list.filter(ex => !isDoneToday(ex)).concat(list.filter(isDoneToday));

      // PT still short of its weekly goal (as of this morning). OK to suggest
      // when its area is ready and it wasn't done yesterday (PT rest day).
      const ptOpen = all.filter(ex => ex.category === 'PT' && !inPlan.has(ex.key)
        && ex.weekDone - ex.slots.filter(slotToday).length < ex.weekTarget);
      const restDay = ex => ex.slots.some(s => !s.noDate && s.days === 1);
      const ptOk = ex => ready(ex) && !restDay(ex);

      // PT comes first, always: every PT still short of its weekly goal is
      // listed. Rested ones (area ready, not done yesterday) lead, most
      // neglected area first; recently done ones follow with the reason —
      // still due this week, just lower.
      const areaGap = ex => effectiveDays(areas[ex.area].since);
      const pt = ptOpen
        .sort((a, b) => ptOk(b) - ptOk(a) || areaGap(b) - areaGap(a) || byNeglect(a, b))
        .map(ex => Object.assign(tag(ex), {
          why: ptOk(ex) ? '' : !ready(ex) ? ex.area + ' resting until ' + areas[ex.area].until
            : 'rest day (done yesterday)',
        }));

      // Secondary: Compound + Isolation by body area, longest since first.
      const readyAreas = Object.values(areas).filter(a => a.ready)
        .sort((a, b) => effectiveDays(b.since) - effectiveDays(a.since) || a.name.localeCompare(b.name));
      const blocks = [];
      for (const a of readyAreas) {
        if (blocks.length >= SUGGEST_AREAS) break;
        const here = all.filter(ex => ex.area === a.name && !inPlan.has(ex.key));
        const best = cat => here.filter(ex => ex.category === cat).sort(byNeglect)[0];
        const items = [best('Compound'), best('Isolation')].filter(Boolean);
        if (!items.length) continue;
        blocks.push({ area: a, items: doneLast(items.sort(byCat).map(tag)) });
      }

      // PT grouped by body area (muscle focus), so it's easy to pick one
      // group and spread the rest across days. Groups with a rested item
      // lead, then most days since the area was trained.
      const ptGroups = [];
      pt.forEach(ex => {
        let g = ptGroups.find(x => x.area.name === ex.area);
        if (!g) ptGroups.push(g = { area: areas[ex.area], items: [] });
        g.items.push(ex);
      });
      // Weekly PT sessions, same count as the PT this week strip:
      // sum min(weekDone, weekTarget) / sum weekTarget, over all PT (met too).
      const ptAll = all.filter(ex => ex.category === 'PT');
      const sessions = list => ({
        done: list.reduce((n, ex) => n + Math.min(ex.weekDone, ex.weekTarget), 0),
        total: list.reduce((n, ex) => n + ex.weekTarget, 0),
      });
      ptGroups.forEach(g => {
        g.items = doneLast(g.items);
        g.ready = g.items.some(ptOk);
        g.week = sessions(ptAll.filter(ex => ex.area === g.area.name));
      });
      ptGroups.sort((a, b) => b.ready - a.ready
        || effectiveDays(b.area.since) - effectiveDays(a.area.since) || a.area.name.localeCompare(b.area.name));

      return {
        pt: doneLast(pt),
        ptGroups,
        ptWeek: sessions(ptAll),
        blocks,
        resting: Object.values(areas).filter(a => !a.ready),
        unmapped: [...new Set(all.filter(ex => ex.area === 'Other').map(ex => ex.group))],
      };
    }

    let suggestOpen = true;

    function linkChip(text, onClick) {
      const b = el('button', 'jump', text);
      b.type = 'button';
      b.addEventListener('click', e => { e.stopPropagation(); onClick(); });
      return b;
    }

    // ---------- Picking: tap several, then "Do today" or "Up next" ----------
    const picked = new Set(); // exercise keys, in the order tapped
    let exByKey = {};

    function pickBox(ex) {
      const cb = el('input', 'pick-cb');
      cb.type = 'checkbox';
      cb.dataset.key = ex.key;
      cb.checked = picked.has(ex.key);
      cb.setAttribute('aria-label', 'Select ' + ex.name);
      cb.addEventListener('click', e => e.stopPropagation());
      cb.addEventListener('change', () => togglePick(ex.key, cb.checked));
      return cb;
    }

    function togglePick(key, on) {
      if (on) picked.add(key); else picked.delete(key);
      document.querySelectorAll('input.pick-cb').forEach(cb => { if (cb.dataset.key === key) cb.checked = on; });
      document.querySelectorAll('.pick-row, .ex').forEach(n => { if (n.dataset.key === key && n.closest('.suggest')) n.classList.toggle('sel', on); });
      renderPickBar();
    }

    // One-tap add for a single exercise: Today / Next. Tapping the active
    // one takes it back off that list.
    function quickAdd(ex, compact) {
      const box = el('div', 'quick' + (compact ? ' compact' : ''));
      const inToday = todayKeys.has(ex.key);
      const inNext = upNextKeys.has(ex.key);
      [['today', inToday, 'Today', 'Added to today: '], ['next', inNext, 'Next', 'Up next: ']].forEach(([to, on, label, msg]) => {
        const b = el('button', 'q-btn' + (on ? ' on' : ''), (on ? '✓ ' : '+ ') + label);
        b.type = 'button';
        // In Today via the plan or a log (not a pick) — nothing to undo here.
        if (on && to === 'today' && !todayPicks().some(it => (findEx(Object.values(exByKey), it) || {}).key === ex.key)) b.disabled = true;
        b.title = on ? 'Remove from ' + (to === 'today' ? 'today' : 'Up next') : 'Add to ' + (to === 'today' ? 'today' : 'Up next');
        b.addEventListener('click', e => {
          e.preventDefault();
          e.stopPropagation();
          savePicks(movePicks([ex.key], on ? null : to), on ? 'Removed: ' + ex.name : msg + ex.name);
        });
        box.append(b);
      });
      return box;
    }

    // Compact one-line row: checkbox · name · why · Today / Next.
    // Tapping the row toggles the checkbox (bulk); the buttons act alone.
    function pickRow(ex, metaText) {
      const row = el('label', 'pick-row' + (isDoneToday(ex) ? ' done' : '') + (picked.has(ex.key) ? ' sel' : ''));
      row.dataset.key = ex.key;
      row.style.setProperty('--hue', heatHue(ex.days, ex.recoveryDays));
      const txt = el('span', 'pr-text');
      txt.append(el('span', 'pr-name', (isDoneToday(ex) ? '✓ ' : '') + ex.name), el('span', 'pr-meta', metaText));
      row.append(pickBox(ex), exThumb(ex), txt);
      if (!isDoneToday(ex)) row.append(quickAdd(ex, true));
      return row;
    }

    // One-line meta under the category/area headings: muscle group + days,
    // e.g. `Glute Med · 33 days since`, or `Glute Med · Later · rest day …`.
    function pickMeta(ex) {
      const g = ex.suggestGroup;
      const parts = [ex.group];
      if (ex.why) parts.push('Later', ex.why);
      else if (g) parts.push(sinceText(g.since));
      return parts.join(' · ');
    }

    let upNextKeys = new Set();
    let todayKeys = new Set();

    // Current picks as stored, ready to edit and send back.
    function currentPicks() {
      return {
        today: { date: data.today, items: todayPicks().slice() },
        next: ((data.picks && data.picks.next) || []).slice(),
      };
    }

    // Shows the change right away, then saves; the server's copy replaces
    // it when it comes back, and a failure puts the old picks back.
    function savePicks(p, msg) {
      const before = data.picks;
      data.picks = { today: p.today.items, next: p.next };
      picked.clear();
      render();
      setStatus(msg || 'Saving…');
      google.script.run
        .withSuccessHandler(result => { data = result; render(); setStatus(msg); })
        .withFailureHandler(err => { data.picks = before; render(); setStatus('Error: ' + err.message); })
        .savePicks(p);
    }

    const pickRef = ex => ({ row: ex.slots[0].row, name: ex.slots[0].name, added: data.today });

    // Removes these exercises from both lists, then (optionally) adds to one.
    function movePicks(keys, to) {
      const all = Object.values(exByKey);
      const p = currentPicks();
      const keyOf = it => (findEx(all, it) || {}).key;
      p.today.items = p.today.items.filter(it => !keys.includes(keyOf(it)));
      p.next = p.next.filter(it => !keys.includes(keyOf(it)));
      const refs = keys.map(k => exByKey[k]).filter(Boolean).map(pickRef);
      if (to === 'today') p.today.items = p.today.items.concat(refs);
      if (to === 'next') p.next = p.next.concat(refs);
      return p;
    }

    function renderPickBar() {
      const bar = document.getElementById('pick-bar');
      const n = picked.size;
      document.body.classList.toggle('picking', n > 0);
      bar.hidden = n === 0;
      bar.querySelector('.pb-count').textContent = n + ' selected';
    }

    document.getElementById('pick-bar').addEventListener('click', e => {
      const to = e.target.dataset && e.target.dataset.to;
      if (!to) return;
      const keys = [...picked];
      if (to === 'clear') { [...keys].forEach(k => togglePick(k, false)); return; }
      savePicks(movePicks(keys, to), (to === 'today' ? 'Added to today: ' : 'Up next: ') + keys.length);
    });

    // Wraps each .sub and the rows after it into a boxed .grp, so blocks
    // (PT, each area, each muscle group, To do / Done) read as separate.
    // A .rest-line or .empty between blocks ends the current box.
    function boxGroups(secEl) {
      let grp = null;
      [...secEl.children].forEach(n => {
        if (n.classList.contains('section-head')) return;
        if (n.classList.contains('sub')) {
          grp = el('div', 'grp');
          secEl.insertBefore(grp, n);
          grp.append(n);
        } else if (grp && ['ex', 'pick-row', 'empty', 'sum-line'].some(c => n.classList.contains(c))) {
          grp.append(n);
        } else {
          grp = null;
        }
      });
      return secEl;
    }

    // "31 days since" / "1 day since" — spelled out (Julius: "31d" was confusing).
    const sinceText = n => n == null ? 'no log' : n + (n === 1 ? ' day' : ' days') + ' since';

    // Subhead for one PT muscle-focus group: `PT · Glutes/Hips · 3 days since`.
    // Area subhead inside a category: `Legs · 31 days since` (+ resting
    // note), with an optional right-hand count.
    function areaSub(a, right) {
      const sub = el('div', 'sub sug-sub area-head');
      const lbl = el('span', '');
      lbl.append(el('strong', 'key', a.name),
        el('span', 'sub-rest', ' · ' + sinceText(a.since) + (a.ready ? '' : ' · resting until ' + a.until)));
      sub.append(lbl);
      if (right) sub.append(el('span', '', right));
      return sub;
    }

    // Suggested as a tree: category (PT → Compound → Isolation), then body
    // area, then exercises. PT areas follow ptGroups order; Compound and
    // Isolation areas keep the blocks' longest-since order.
    function appendSuggestTree(target, sug, rowFn, hideDone) {
      const keep = list => hideDone ? list.filter(ex => !isDoneToday(ex)) : list;
      const cats = [];
      const pt = sug.ptGroups.map(g => ({ area: g.area, right: g.week.done + ' / ' + g.week.total + ' this week', items: keep(g.items) }));
      cats.push({ name: 'PT', rest: ' — do these first', right: sug.ptWeek.done + ' / ' + sug.ptWeek.total + ' this week', groups: pt });
      ['Compound', 'Isolation'].forEach(cat => cats.push({ name: cat, rest: '', right: '',
        groups: sug.blocks.map(b => ({ area: b.area, right: '', items: keep(b.items.filter(ex => ex.category === cat)) })) }));
      cats.forEach(c => {
        const groups = c.groups.filter(g => g.items.length);
        if (!groups.length) return;
        const head = el('div', 'cat-head');
        const lbl = el('span', '');
        lbl.append(el('span', 'cat-name', c.name), el('span', 'cat-rest', c.rest));
        head.append(lbl, el('span', 'cat-count', c.right));
        target.append(head);
        groups.forEach(g => {
          target.append(areaSub(g.area, g.right));
          g.items.forEach(ex => target.append(rowFn(ex)));
        });
      });
    }

    // ---------- PT spread (2026-10-26, Julius) ----------
    // N PT picks spread across the PT muscle groups (column A: Core, Glute
    // Max, Glute Med, Hamstrings, Quads). Every slot goes to the group with
    // the highest score = days rested / (slots it already has + 1), so a
    // fresh start gives one per group, and a very rested group can earn a
    // second pick before a just-trained one gets its first. Nothing is
    // skipped; done today/yesterday just scores low (min 1 day). As of this
    // morning, like the rest of Suggested, so it doesn't reshuffle while
    // logging. Inside a group: still owed this week first, then longest gap.
    const SPREAD_MIN = 1, SPREAD_MAX = 10;
    let spreadN = 5;
    try {
      const v = parseInt(localStorage.getItem('spreadN'), 10);
      if (v >= SPREAD_MIN && v <= SPREAD_MAX) spreadN = v;
    } catch (e) {}

    function ptSpread(sections, n) {
      const all = [].concat(...sections.map(s => s.exercises));
      const pt = all.filter(ex => ex.category === 'PT').sort((a, b) => a.firstRow - b.firstRow);
      const groups = groupStatus(all);
      const order = [];
      pt.forEach(ex => { if (!order.includes(ex.group)) order.push(ex.group); });
      const rested = g => Math.max(1, effectiveDays(groups[g].since));
      const owed = ex => ex.weekDone - ex.slots.filter(slotToday).length < ex.weekTarget;
      const pool = {}, taken = {};
      order.forEach(g => {
        taken[g] = 0;
        pool[g] = pt.filter(ex => ex.group === g)
          .sort((a, b) => owed(b) - owed(a) || daysBeforeToday(b) - daysBeforeToday(a) || a.firstRow - b.firstRow);
      });
      const out = [];
      while (out.length < n) {
        let best = null, bestScore = -1;
        order.forEach(g => {
          if (taken[g] >= pool[g].length) return;
          const score = rested(g) / (taken[g] + 1);
          // Ties: the group with fewer picks wins (spread), then the more rested.
          const tie = score === bestScore && (taken[g] < taken[best] || (taken[g] === taken[best] && rested(g) > rested(best)));
          if (score > bestScore || tie) { best = g; bestScore = score; }
        });
        if (best == null) break;
        out.push(Object.assign({}, pool[best][taken[best]++], { spreadSince: groups[best].since }));
      }
      return out;
    }

    function spreadBlock(sections) {
      const list = ptSpread(sections, spreadN);
      const box = el('div', 'spread');
      if (!list.length) return box;
      const head = el('div', 'cat-head');
      const lbl = el('span', '');
      lbl.append(el('span', 'cat-name', 'PT spread'), el('span', 'cat-rest', ' · most rested groups'));
      head.append(lbl, el('span', 'cat-count', String(list.length)));
      box.append(head);
      list.forEach(ex => {
        const done = isDoneToday(ex);
        const row = el('div', 'spread-row' + (done ? ' done' : ''));
        row.dataset.key = ex.key;
        const txt = el('span', 'sp-text');
        txt.append(el('span', 'sp-name', (done ? '✓ ' : '') + ex.name),
          el('span', 'sp-meta', ex.group + ' · ' + sinceText(ex.spreadSince)));
        row.append(exThumb(ex), txt);
        if (!done) row.append(quickAdd(ex, true));
        box.append(row);
      });
      return box;
    }

    // ---------- PT rotation (2026-10-26, Julius) ----------
    // A fixed, repeating order through every PT exercise: one from each PT
    // muscle group in sheet order, then the second of each, and so on. The
    // list starts right after the most recently logged PT exercise (as of
    // this morning), so it just keeps cycling. It's only an order shown in
    // Suggested — nothing is written anywhere. Any slot can be switched for
    // today to a Compound or Isolation pick (⇄ cycles PT → Compound →
    // Isolation); the PT it replaced stays next in line for next time.
    let ptMode = 'rotation';
    try { if (localStorage.getItem('ptMode') === 'spread') ptMode = 'spread'; } catch (e) {}

    function ptCycle(all) {
      const pt = all.filter(ex => ex.category === 'PT').sort((a, b) => a.firstRow - b.firstRow);
      const order = [];
      pt.forEach(ex => { if (!order.includes(ex.group)) order.push(ex.group); });
      const byGroup = order.map(g => pt.filter(ex => ex.group === g));
      const cycle = [];
      for (let i = 0; cycle.length < pt.length; i++) byGroup.forEach(list => { if (list[i]) cycle.push(list[i]); });
      return cycle;
    }

    function ptRotation(sections, n) {
      const all = [].concat(...sections.map(s => s.exercises));
      const cycle = ptCycle(all);
      if (!cycle.length) return [];
      // Last PT done before today; same day → the later one in the cycle.
      let last = -1, lastDays = Infinity;
      cycle.forEach((ex, i) => {
        const d = realDaysBeforeToday(ex);
        if (d != null && d <= lastDays) { last = i; lastDays = d; }
      });
      const groups = groupStatus(all);
      const out = [];
      for (let k = 0; k < Math.min(n, cycle.length); k++) {
        const i = (last + 1 + k) % cycle.length;
        out.push(Object.assign({}, cycle[i], { rotPos: i + 1, rotOf: cycle.length, spreadSince: groups[cycle[i].group].since }));
      }
      return out;
    }

    // Today's swaps: { date, slots: { slotIndex: 'Compound' | 'Isolation' } }.
    function rotSwaps() {
      try {
        const v = JSON.parse(localStorage.getItem('rotSwaps') || 'null');
        if (v && v.date === data.today && v.slots) return v.slots;
      } catch (e) {}
      return {};
    }
    function setRotSwap(i, cat) {
      const slots = rotSwaps();
      if (cat) slots[i] = cat; else delete slots[i];
      try { localStorage.setItem('rotSwaps', JSON.stringify({ date: data.today, slots })); } catch (e) {}
      render();
    }
    const SWAP_NEXT = { PT: 'Compound', Compound: 'Isolation', Isolation: null };

    // Compound / Isolation fill-ins: Suggested's area picks first (most
    // neglected ready areas), then everything else in that category, longest gap first.
    function swapPool(sections, cat) {
      const sug = suggestedExercises(sections);
      const all = [].concat(...sections.map(s => s.exercises));
      const first = [].concat(...sug.blocks.map(b => b.items)).filter(ex => ex.category === cat);
      const rest = all.filter(ex => ex.category === cat && !first.some(f => f.key === ex.key))
        .sort((a, b) => daysBeforeToday(b) - daysBeforeToday(a) || a.firstRow - b.firstRow);
      return first.concat(rest);
    }

    function rotationBlock(sections) {
      const list = ptRotation(sections, spreadN);
      const box = el('div', 'spread');
      if (!list.length) return box;
      const slots = rotSwaps();
      const used = new Set(list.map(ex => ex.key));
      const pools = {};
      const groups = groupStatus([].concat(...sections.map(s => s.exercises)));
      const head = el('div', 'cat-head');
      const lbl = el('span', '');
      lbl.append(el('span', 'cat-name', 'PT rotation'), el('span', 'cat-rest', ' · next in order'));
      head.append(lbl, el('span', 'cat-count', String(list.length)));
      box.append(head);
      list.forEach((pt, i) => {
        const cat = slots[i];
        let ex = pt;
        if (cat) {
          const pool = pools[cat] || (pools[cat] = swapPool(sections, cat));
          const pick = pool.find(x => !used.has(x.key));
          if (pick) { used.add(pick.key); ex = Object.assign({}, pick, { spreadSince: (groups[pick.group] || {}).since }); }
        }
        const swapped = ex !== pt;
        const done = isDoneToday(ex);
        const row = el('div', 'spread-row' + (done ? ' done' : '') + (swapped ? ' swapped' : ''));
        row.dataset.key = ex.key;
        const txt = el('span', 'sp-text');
        const meta = swapped
          ? ex.category + ' · ' + ex.group + ' · ' + sinceText(ex.spreadSince) + ' · instead of ' + pt.name
          : ex.group + ' · ' + sinceText(ex.spreadSince);
        txt.append(el('span', 'sp-name', (done ? '✓ ' : '') + ex.name), el('span', 'sp-meta', meta));
        const pos = el('span', 'sp-pos', swapped ? '⇄' : String(pt.rotPos));
        pos.title = swapped ? 'Switched for today' : pt.rotPos + ' of ' + pt.rotOf + ' in the PT rotation';
        const cur = cat && swapped ? cat : 'PT';
        const nextCat = SWAP_NEXT[cur];
        const sw = el('button', 'sp-swap', '⇄ ' + (nextCat ? nextCat.slice(0, 4) : 'PT'));
        sw.type = 'button';
        sw.title = nextCat ? 'Switch this slot to a ' + nextCat + ' pick for today' : 'Back to the PT rotation';
        sw.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); setRotSwap(i, nextCat); });
        row.append(pos, exThumb(ex), txt);
        if (!done) row.append(quickAdd(ex, true));
        row.append(sw);
        box.append(row);
      });
      return box;
    }

    function ptOrderBlock(sections) {
      return ptMode === 'spread' ? spreadBlock(sections) : rotationBlock(sections);
    }
    function setPtMode(mode) {
      ptMode = mode === 'spread' ? 'spread' : 'rotation';
      try { localStorage.setItem('ptMode', ptMode); } catch (e) {}
      markPtMode();
      render();
    }
    function markPtMode() {
      document.querySelectorAll('[data-ptmode]').forEach(b => b.classList.toggle('on', b.dataset.ptmode === ptMode));
    }

    function setSpreadN(n) {
      spreadN = Math.max(SPREAD_MIN, Math.min(SPREAD_MAX, n));
      try { localStorage.setItem('spreadN', String(spreadN)); } catch (e) {}
      document.getElementById('spread-n').textContent = spreadN;
      render();
    }

    function suggestSection(sections) {
      const sug = suggestedExercises(sections);
      const secEl = el('section', 'section wide suggest');
      secEl.id = 'suggest-sec';
      const open = suggestOpen;
      if (!open) secEl.classList.add('collapsed');
      const head = el('div', 'section-head');
      const name = el('span', 'section-name', 'Suggested — today');
      name.append(el('span', 'chev', open ? '▾' : '▸'));
      const items = sug.pt.concat(...sug.blocks.map(b => b.items));
      const done = items.filter(isDoneToday).length;
      head.append(name, el('span', 'section-count', items.length ? done + ' / ' + items.length + ' done' : ''));
      if (open) {
        const editBtn = el('button', 'rest-edit-btn', restEditOpen ? 'Done' : 'Rest days ✎');
        editBtn.type = 'button';
        editBtn.addEventListener('click', e => { e.stopPropagation(); restEditOpen = !restEditOpen; restDraft = null; render(); });
        head.append(editBtn);
      }
      head.addEventListener('click', () => { suggestOpen = !open; render(); });
      secEl.append(head);

      if (open) {
        // Resting line only when something is resting (Julius: no "Everything is rested").
        const restParts = sug.resting.map(a => a.name + ' (until ' + a.until + ')');
        if (restParts.length || sug.unmapped.length) {
          const rest = el('div', 'rest-line', restParts.length ? 'Resting: ' + restParts.join(' · ') : '');
          if (sug.unmapped.length) rest.append(el('span', 'unmapped', (restParts.length ? ' · ' : '') + 'Unmapped: ' + sug.unmapped.join(', ')));
          secEl.append(rest);
        }
        if (restEditOpen) secEl.append(restEditor());
      }

      secEl.append(ptOrderBlock(sections));
