<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <style>
    :root {
      --bg: #f4f3ef;
      --card: #ffffff;
      --text: #2a2a27;
      --muted: #77766f;
      --border: #e4e2dc;
      --soft: #ecebe6;
      /* Heat tones are kept low-saturation so the list isn't shouty. */
      --heat-sat: 48%;
      --heat-light: 56%;
      --tint: 14%;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171716;
        --card: #212120;
        --text: #ecebe6;
        --muted: #9d9c95;
        --border: #33332f;
        --soft: #2a2a28;
        --heat-sat: 40%;
        --heat-light: 52%;
        --tint: 16%;
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0 auto;
      padding: 0 12px 32px;
      background: var(--bg);
      color: var(--text);
      max-width: 640px;
      -webkit-text-size-adjust: 100%;
    }

    @media (min-width: 900px) {
      body { max-width: 1200px; padding: 0 16px 32px; }
    }

    /* Header + view buttons stay pinned while scrolling on the phone. */
    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      padding: 10px 0 8px;
      margin-bottom: 4px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 { font-size: 18px; margin: 0; flex: 1; }

    #status { color: var(--muted); font-size: 12px; text-align: right; }

    header .notes-btn {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font-size: 13px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-top: 8px;
      padding: 3px;
      background: var(--soft);
      border-radius: 10px;
    }

    .controls button {
      padding: 8px 2px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      font-size: 13px;
      white-space: nowrap;
    }

    .controls button.active {
      background: var(--card);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }

    .legend .bar {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right,
        hsl(0 var(--heat-sat) var(--heat-light)),
        hsl(35 var(--heat-sat) var(--heat-light)),
        hsl(60 var(--heat-sat) var(--heat-light)),
        hsl(120 var(--heat-sat) var(--heat-light)));
    }

    #groups {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    @media (min-width: 900px) {
      #groups { grid-template-columns: 1fr 1fr; }
      #groups .section.wide { grid-column: 1 / -1; }
    }

    /* ---------- Sections and exercise cards ---------- */

    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
    }

    .section-name { font-size: 15px; font-weight: 700; }
    .section-count { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .sub {
      display: flex;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--soft);
      border-top: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .ex {
      --accent: hsl(var(--hue) var(--heat-sat) var(--heat-light));
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 10px;
      padding: 10px 12px 10px 10px;
      border-top: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      background: color-mix(in srgb, var(--accent) var(--tint), var(--card));
    }

    .ex.done { opacity: 0.55; }

    .ex-name { font-size: 15px; font-weight: 600; line-height: 1.25; }
    .ex-meta { font-size: 12px; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; grid-column: 1 / -1; }
    .ex-note { font-size: 12px; font-style: italic; color: var(--muted); grid-column: 1 / -1; }

    .tag {
      display: inline-block;
      padding: 0 6px;
      margin: 2px 4px 0 0;
      border-radius: 4px;
      background: var(--soft);
      font-size: 11px;
      color: var(--text);
    }

    /* Facts block: one row each for Last, This wk, Prev, Prev 2 —
       labels in a fixed left column so values line up. */
    .facts {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 2px 10px;
      margin-top: 6px;
      padding: 6px 8px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--card) 70%, transparent);
      font-size: 12px;
      line-height: 1.35;
    }
    .facts dt { color: var(--muted); font-weight: 600; }
    .facts dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
    .facts .sep { color: var(--muted); padding: 0 4px; }
    .dots { letter-spacing: 1px; color: var(--accent); }
    .dots-n { color: var(--muted); margin-left: 6px; }

    .pill {
      align-self: start;
      min-width: 58px;
      text-align: center;
      padding: 3px 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 30%, var(--card));
      border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--card));
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .log {
      grid-column: 1 / -1;
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .log input {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 10px;
      font-size: 16px; /* 16px stops iPhone zooming in on focus */
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
    }

    .log input.weight { flex: 0 0 6.5em; }

    .log button {
      height: 40px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid color-mix(in srgb, var(--accent) 60%, var(--text));
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
    }

    .log button:disabled { opacity: 0.5; }

    /* Focus table: today's plan pinned above every list. */
    .section.focus { border: 1.5px solid var(--muted); }
    .section.focus .section-head { background: var(--soft); }

    /* Suggested — today: picked from rested body areas. */
    .section.suggest { border: 2px solid var(--accent); }
    .section.suggest .section-head { background: color-mix(in srgb, var(--accent) 18%, var(--card)); cursor: pointer; font-weight: 700; }
    .section.suggest.collapsed .sug-sub, .section.suggest.collapsed .rest-edit { display: none; }
    .sug-sub { font-weight: 700; }
    .rest-line .jump {
      margin: 2px 4px 2px 0; padding: 2px 9px; font-size: 12px;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--card); color: var(--text); text-align: left;
    }
    .pt-due .jump { border-color: hsl(40 60% 55%); }
    .section.suggest.collapsed .ex, .section.suggest.collapsed .rest-line { display: none; }
    .section.suggest .chev { font-size: 11px; color: var(--muted); margin-left: 6px; }
    .rest-line {
      padding: 6px 12px; font-size: 12px; color: var(--muted);
      border-top: 1px solid var(--border); line-height: 1.4;
    }
    .due-line { color: var(--text); }
    .due-line b { font-weight: 600; }
    .rest-line .unmapped { color: hsl(35 60% 42%); }
    .tag.area { background: color-mix(in srgb, var(--accent) 22%, var(--card)); }
    .tag.other { outline: 1px dashed hsl(35 60% 50%); }

    /* Recovery days editor (inside Suggested). */
    .rest-edit-btn {
      margin-left: 6px; padding: 1px 8px; font-size: 12px;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--card); color: var(--text);
    }
    .section.suggest.collapsed .rest-edit { display: none; }
    .rest-edit { padding: 8px 12px 10px; border-top: 1px solid var(--border); font-size: 14px; }
    .rest-edit .hint { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    .rest-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    .rest-row .rest-name { flex: 1; }
    .rest-row .rest-def { font-size: 11px; color: var(--muted); min-width: 5.5em; text-align: right; }
    .rest-row button, .rest-actions button {
      min-width: 34px; height: 32px; padding: 0 10px; font-size: 15px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--card); color: var(--text);
    }
    .rest-row .rest-val { min-width: 2.6em; text-align: center; font-weight: 600; }
    .rest-row.changed .rest-val { color: var(--accent); }
    .rest-actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .rest-actions .rest-msg { font-size: 12px; color: var(--muted); }

    .empty { color: var(--muted); text-align: center; padding: 24px 0; grid-column: 1 / -1; }

    /* ---------- Notes side panel ---------- */
    #notes-shade {
      position: fixed; inset: 0; z-index: 10; background: rgb(0 0 0 / 0.3);
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    #notes-panel {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 11;
      width: min(360px, 88vw);
      background: var(--card); color: var(--text);
      border-left: 1px solid var(--border);
      padding: 16px; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.2s;
      display: flex; flex-direction: column; gap: 10px;
    }
    body.notes-open #notes-shade { opacity: 1; pointer-events: auto; }
    body.notes-open #notes-panel { transform: none; }
    #notes-panel .panel-head { display: flex; justify-content: space-between; align-items: center; }
    #notes-panel h2 { font-size: 17px; margin: 0; }
    #notes-panel textarea {
      width: 100%; min-height: 70px; padding: 8px;
      font: inherit; font-size: 16px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text);
    }
    #notes-panel button {
      padding: 6px 12px; font-size: 14px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--card); color: var(--text);
    }
    #notes-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    #notes-list li {
      display: flex; gap: 8px; align-items: flex-start;
      padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
    }
    #notes-list li span { flex: 1; overflow-wrap: anywhere; }
    #notes-list li button { padding: 0 8px; }
    #notes-status { font-size: 12px; color: var(--muted); }

    /* ---------- PT this week: pinned checklist strip ---------- */
    #pt-strip { margin-top: 8px; }
    #pt-strip:empty { display: none; }
    .pt-line {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600;
    }
    .pt-line .pt-label { white-space: nowrap; min-width: 6.8em; }
    .pt-line .pt-count { white-space: nowrap; color: var(--muted); font-weight: 500; }
    /* Segmented bars: one box per exercise. */
    .seg-bar { flex: 1; display: flex; gap: 2px; min-width: 0; }
    .seg {
      --fill: hsl(120 var(--heat-sat) var(--heat-light));
      flex: 1; min-width: 2px; height: 9px;
      border-radius: 2px;
      background: var(--soft);
      box-shadow: inset 0 0 0 1px var(--border);
      overflow: hidden;
    }
    .seg.full { background: var(--fill); box-shadow: none; }
    .seg i { display: block; height: 100%; background: hsl(40 65% 60%); }
    .seg-bar.all .seg { --fill: hsl(140 55% 42%); }
    .seg-bar.blue .seg { --fill: hsl(210 var(--heat-sat) var(--heat-light)); height: 7px; }
    .wk-days { font-weight: 600; }
    .pt-count .started { color: hsl(35 60% 42%); }
    @media (prefers-color-scheme: dark) { .pt-count .started { color: hsl(40 65% 62%); } }
    /* Bonus line: same shape, quieter — optional, not a to-do. */
    .pt-line.bonus { margin-top: 6px; font-weight: 500; color: var(--muted); }
    .pt-chips {
      display: flex; gap: 6px; margin-top: 6px;
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .pt-chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 4px;
      max-width: 11em;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
    }
    .chip .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip .chip-n { font-size: 11px; color: var(--muted); }
    .chip.partial { border-color: hsl(40 60% 55%); background: color-mix(in srgb, hsl(40 70% 60%) 14%, var(--card)); }
    .chip.met { border-color: transparent; background: color-mix(in srgb, hsl(130 45% 50%) 18%, var(--card)); color: var(--muted); }

    /* PT cards: met ones get a check and step back so what's left stands out. */
    .ex.met .ex-name::before { content: '✓ '; color: hsl(130 45% 40%); }
    .ex.met:not(.done) { opacity: 0.7; }
    .ex { scroll-margin-top: 150px; }
    .ex.flash { animation: flash 1.2s ease-out; }
    @keyframes flash { from { box-shadow: inset 0 0 0 2px var(--text); } to { box-shadow: inset 0 0 0 2px transparent; } }
  </style>
</head>

<body>
  <div class="top">
    <header>
      <h1>Exercise Tracker</h1>
      <div id="status">Loading…</div>
      <button class="notes-btn" id="notes-open" type="button">Notes</button>
    </header>

    <div class="controls">
      <button data-sort="category" class="active">Category</button>
      <button data-sort="days">Days</button>
      <button data-sort="today">Done today</button>
      <button data-sort="plan">Plan</button>
    </div>

    <div id="pt-strip"></div>

    <div class="legend"><span>Just trained</span><div class="bar"></div><span>Recovered</span></div>
  </div>

  <div id="groups"></div>

  <div id="notes-shade"></div>
  <aside id="notes-panel" aria-label="App notes">
    <div class="panel-head">
      <h2>App notes</h2>
      <button type="button" id="notes-close">Close</button>
    </div>
    <form id="notes-form">
      <textarea id="notes-input" placeholder="Change to make in the app…"></textarea>
      <button type="submit">Add note</button>
    </form>
    <div id="notes-status"></div>
    <ul id="notes-list"></ul>
  </aside>

  <script>
    let data = null;
    let sortMode = 'category';

    const NO_DATE_DAYS = 30; // exercises with no date count as this many days

    // Apps Script turns null into undefined; no date → NO_DATE_DAYS.
    function effectiveDays(n) {
      return (n == null || isNaN(n)) ? NO_DATE_DAYS : n;
    }

    // Hue for the heat color: 0 = just trained (red) → 120 = recovered (green).
    function heatHue(days, recoveryDays) {
      const t = Math.max(0, Math.min(1, days / recoveryDays));
      return Math.round(t * 120);
    }

    function daysLabel(n) {
      if (n === 0) return 'today';
      if (n === 1) return '1 day';
      return n + ' days';
    }

    // Week runs Monday–Sunday.
    function weekStartIso() {
      const [y, m, d] = data.today.split('-').map(Number);
      const t = new Date(y, m - 1, d);
      t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
      return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
    }

    // Per sheet row ("slot").
    const slotThisWeek = s => !s.noDate && s.lastDate >= weekStartIso();
    const slotToday = s => !s.noDate && s.lastDate === data.today;

    // Per merged exercise.
    const isDoneToday = ex => ex.slots.some(slotToday);
    function weekCount(list) {
      const done = list.reduce((n, ex) => n + ex.weekDone, 0);
      const total = list.reduce((n, ex) => n + ex.slots.length, 0);
      return done + ' / ' + total;
    }

    // Weight = the leading part of a log entry when it has letters,
    // e.g. "25lbs, 30, 25" → "25lbs", "20lbx2,  18" → "20lbx2", "thk red. 40" → "thk red".
    function weightOf(entry) {
      const head = String(entry || '').split(/,|\.\s/)[0].trim().replace(/\.$/, '');
      return /[a-z]/i.test(head) ? head : '';
    }

    function baseName(name) {
      return String(name).replace(/[.\s]+$/, '').replace(/\.?\s+\d.*$/, '').trim().toLowerCase();
    }

    // "Side Lying Hip Abduction    2-3x a wk" → name "Side Lying Hip Abduction", freq "2–3×/wk".
    const FREQ_RE = /\s*(\d)\s*(?:-\s*(\d))?\s*x\s*(?:a|\/)\s*wk\.?\s*$/i;
    function splitName(name) {
      const raw = String(name).trim();
      const m = raw.match(FREQ_RE);
      const clean = (m ? raw.slice(0, m.index) : raw).replace(/[.\s]+$/, '').replace(/\s{2,}/g, ' ');
      const freq = m ? (m[2] ? m[1] + '–' + m[2] : m[1]) + '×/wk' : '';
      return { name: clean || raw, freq, freqMin: m ? Number(m[1]) : 0 };
    }

    // Last weight used: newest entry across this exercise's rows, else any
    // row with the same exercise name.
    function lastWeight(ex) {
      const fromRow = list => (list || []).map(weightOf).find(Boolean) || '';
      for (const s of ex.recent) {
        const w = fromRow(s.sets);
        if (w) return w;
      }
      const key = baseName(ex.target.name);
      for (const g of data.groups) for (const other of g.exercises) {
        if (baseName(other.name) === key) {
          const w = fromRow(other.sets);
          if (w) return w;
        }
      }
      return '';
    }

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    // Three top categories; the sheet's Abs section lives under Isolation.
    function categoryOf(section) {
      const s = String(section || '');
      if (/^pt\b/i.test(s)) return 'PT';
      if (/compound/i.test(s)) return 'Compound';
      if (/abs|isolation/i.test(s)) return 'Isolation';
      return s.split(' (')[0] || 'Other';
    }

    // Every sheet row as a flat list, sheet order.
    function sheetRows() {
      const all = [];
      data.groups.forEach(g => g.exercises.forEach(ex =>
        all.push(Object.assign({ group: g.name, area: g.area || 'Other', recoveryDays: g.recoveryDays }, ex, {
          days: effectiveDays(ex.daysSince),
          noDate: ex.daysSince == null,
          category: categoryOf(ex.section),
        }))));
      return all.sort((a, b) => a.row - b.row);
    }

    // Duplicate rows (PT exercises have one row per weekly session) become one
    // exercise. Each row is a "slot"; logging fills the next open slot.
    function mergeDupes(rows) {
      const list = [];
      const byKey = {};
      rows.forEach(r => {
        const key = r.category + '|' + r.group + '|' + baseName(r.name);
        if (!byKey[key]) list.push(byKey[key] = { key, slots: [] });
        byKey[key].slots.push(r);
      });
      return list.map(({ key, slots }) => {
        const recent = slots.slice().sort((a, b) => a.days - b.days || a.row - b.row);
        const latest = recent[0];
        // Already logged today → same row again; otherwise first row not done
        // this week; all done → the oldest one.
        const target = slots.find(slotToday) || slots.find(s => !slotThisWeek(s)) || recent[recent.length - 1];
        const parts = slots.map(s => splitName(s.name));
        const shortest = parts.reduce((a, b) => (b.name.length < a.name.length ? b : a));
        const weekDone = slots.filter(slotThisWeek).length;
        // Weekly goal: the low end of "2-3x a wk", else one per sheet row.
        const weekTarget = Math.min(parts.map(p => p.freqMin).find(Boolean) || slots.length, slots.length) || 1;
        return {
          key, slots, recent, latest, target,
          name: shortest.name,
          freq: parts.map(p => p.freq).find(Boolean) || '',
          group: latest.group,
          area: latest.area,
          category: latest.category,
          recoveryDays: latest.recoveryDays,
          days: latest.days,
          noDate: latest.noDate,
          lastDate: latest.lastDate,
          dateText: latest.dateText,
          firstRow: slots[0].row,
          weekDone,
          weekTarget,
          met: weekDone >= weekTarget,
        };
      });
    }

    // Merged exercises grouped into PT / Compound / Isolation, sheet order.
    function buildSections() {
      const sections = [];
      const byName = {};
      mergeDupes(sheetRows()).forEach(ex => {
        if (!byName[ex.category]) sections.push(byName[ex.category] = { name: ex.category, exercises: [] });
        byName[ex.category].exercises.push(ex);
      });
      return sections;
    }

    // Weight + sets, tap Log. Writes to the target row (next open slot).
    function logBox(ex) {
      const form = el('form', 'log');
      const weight = el('input', 'weight');
      weight.placeholder = 'Weight';
      weight.value = (ex.plan && ex.plan.weight) || lastWeight(ex);
      const input = el('input');
      input.placeholder = '15, 15, 15';
      input.enterKeyHint = 'done';
      input.inputMode = 'text';
      const btn = el('button', '', 'Log');
      btn.type = 'submit';
      form.append(weight, input, btn);
      form.addEventListener('submit', e => {
        e.preventDefault();
        let w = weight.value.trim();
        if (/^\d+(\.\d+)?$/.test(w)) w += 'lbs'; // plain number → pounds
        const sets = input.value.trim();
        const entry = sets ? [w, sets].filter(Boolean).join(', ') : '';
        if (!entry && !confirm('Mark "' + ex.name + '" done today with no sets?')) return;
        btn.disabled = true;
        btn.textContent = '…';
        setStatus('Saving ' + ex.name + '…');
        google.script.run
          .withSuccessHandler(result => {
            data = result;
            render();
            setStatus('Logged ' + ex.name);
          })
          .withFailureHandler(err => {
            btn.disabled = false;
            btn.textContent = 'Log';
            setStatus('Error: ' + err.message);
          })
          .logExercise(ex.target.row, ex.target.name, entry);
      });
      return form;
    }

    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    // "2026-10-26" → "M". Su M T W Th F Sa.
    const DAY_ABBR = ['Su', 'M', 'T', 'W', 'Th', 'F', 'Sa'];
    function dayAbbr(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return DAY_ABBR[new Date(y, m - 1, d).getDay()];
    }

    // Segmented bar: one box per item. cells = fill amounts 0..1, filled first.
    function segBar(cells, cls) {
      const bar = el('div', 'seg-bar' + (cls ? ' ' + cls : ''));
      cells.slice().sort((a, b) => b - a).forEach(v => {
        const seg = el('span', 'seg' + (v >= 1 ? ' full' : v > 0 ? ' part' : ''));
        if (v > 0 && v < 1) {
          const i = el('i');
          i.style.width = Math.round(v * 100) + '%';
          seg.append(i);
        }
        bar.append(seg);
      });
      return bar;
    }

    const cleanEntry = s => String(s || '').replace(/\s+/g, ' ').replace(/[,.\s]+$/, '');

    // Facts block, one labelled row each:
    //   Last     10/22 Thurs · Oct wk 4 of 5
    //   This wk  ●●○  2 of 3
    //   Prev     light band, 20,20
    //   Prev 2   light band, 15,15
    function historyLine(ex) {
      const facts = el('dl', 'facts');
      const row = (label, ...values) => {
        const dd = el('dd');
        dd.append(...values);
        facts.append(el('dt', '', label), dd);
      };

      const text = String(ex.dateText || '');
      const [datePart, ...rest] = text.split('|').map(t => t.trim());
      const extra = rest.join(' | ');
      const wk = extra.match(/^wk\s*(\d)\s*\/\s*(\d)$/i);
      if (!ex.noDate) {
        const parts = [document.createTextNode(datePart)];
        if (wk) parts.push(el('span', 'sep', '·'), document.createTextNode(MONTHS[Number(ex.lastDate.slice(5, 7)) - 1] + ' wk ' + wk[1] + ' of ' + wk[2]));
        else if (extra && extra !== 'i') parts.push(el('span', 'sep', '·'), document.createTextNode(extra));
        row('Last', ...parts);
      } else if (text.trim() && text.trim() !== 'i') {
        row('Note', document.createTextNode(text.trim()));
      }

      if (ex.slots.length > 1 || ex.category === 'PT') {
        // One dot per session in the weekly goal (more if he went over).
        const n = Math.max(ex.weekTarget, ex.weekDone);
        const days = ex.slots.filter(slotThisWeek).map(s => s.lastDate).sort().map(dayAbbr);
        const parts = [el('span', 'dots', '●'.repeat(ex.weekDone) + '○'.repeat(n - ex.weekDone)),
          el('span', 'dots-n', ex.weekDone + ' of ' + ex.weekTarget + (ex.met ? ' ✓' : ''))];
        if (days.length) parts.push(el('span', 'sep', '·'), el('span', 'wk-days', days.join(' ')));
        row('This wk', ...parts);
      }

      // One row: its last two logs. Several rows: the newest log of each, newest row first.
      const entries = ex.slots.length > 1
        ? ex.recent.map(s => cleanEntry((s.sets || [])[0])).filter(Boolean)
        : (ex.latest.sets || []).map(cleanEntry).filter(Boolean);
      if (entries[0]) row('Prev', document.createTextNode(entries[0]));
      if (entries[1]) row('Prev 2', document.createTextNode(entries[1]));
      return facts.childNodes.length ? facts : null;
    }

    // Plan from plan.js, matched by row (falls back to name if rows moved).
    // Keeps plan order, but anything already logged today moves to the end.
    function plannedExercises(sections) {
      const all = [].concat(...sections.map(s => s.exercises));
      const seen = new Set();
      const planned = [];
      (data.plan || []).forEach(p => {
        const ex = all.find(e => e.slots.some(s => s.row === p.row && s.name === p.name))
          || all.find(e => e.slots.some(s => s.name === p.name));
        if (!ex || seen.has(ex.key)) return;
        seen.add(ex.key);
        planned.push(Object.assign({}, ex, { plan: p }));
      });
      return planned.filter(ex => !isDoneToday(ex)).concat(planned.filter(isDoneToday));
    }

    // ---------- Suggested exercises ----------
    // Picked "as of this morning": logs dated today are ignored for readiness,
    // so the list doesn't reshuffle as he logs. Done-today items sink and dim.
    // Priority: PT > Compound > Isolation (the sheet's Abs live in Isolation).
    const SUGGEST_PT_MAX = 6;
    const SUGGEST_COMPOUND_MAX = 3;
    const SUGGEST_ISO_MAX = 3;
    const SHORT_DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    // Real days since this exercise before today, or null if never dated (a row
    // logged today has lost its old date, so it doesn't count).
    function realDaysBeforeToday(ex) {
      const prior = ex.slots.filter(s => !s.noDate && !slotToday(s)).map(s => s.days);
      return prior.length ? Math.min(...prior) : null;
    }
    const daysBeforeToday = ex => effectiveDays(realDaysBeforeToday(ex));

    // Per area: days since anything in it was trained (before today), ready or
    // resting, and the weekday it's ready again.
    function areaStatus(all) {
      const out = {};
      const config = data.areas || [];
      const daysFor = name => (config.find(a => a.name === name) || { days: 2 }).days;
      all.forEach(ex => {
        const a = out[ex.area] || (out[ex.area] = { name: ex.area, days: daysFor(ex.area), since: null });
        const d = realDaysBeforeToday(ex);
        if (d != null && (a.since == null || d < a.since)) a.since = d;
      });
      const [y, m, d] = data.today.split('-').map(Number);
      Object.values(out).forEach(a => {
        a.ready = a.since == null || a.since >= a.days;
        const until = new Date(y, m - 1, d + (a.days - a.since));
        a.until = a.days - a.since === 1 ? 'tomorrow' : SHORT_DAYS[until.getDay()];
      });
      return out;
    }

    // Days since anything in a muscle group (column A) was trained, before
    // today; never-logged groups count as NO_DATE_DAYS.
    function groupStatus(all) {
      const out = {};
      all.forEach(ex => {
        const d = realDaysBeforeToday(ex);
        const g = out[ex.group] || (out[ex.group] = { name: ex.group, since: null });
        if (d != null && (g.since == null || d < g.since)) g.since = d;
      });
      return out;
    }

    function suggestedExercises(sections) {
      const all = [].concat(...sections.map(s => s.exercises));
      const areas = areaStatus(all);
      const groups = groupStatus(all);
      const inPlan = new Set(plannedExercises(sections).map(ex => ex.key));
      const ready = ex => areas[ex.area] && areas[ex.area].ready;
      const gap = ex => daysBeforeToday(ex);
      const areaGap = ex => effectiveDays(areas[ex.area].since);
      const groupGap = ex => effectiveDays(groups[ex.group].since);
      // Direction: the most neglected body area first, then the most neglected
      // muscle group in it, then the exercise with the longest gap.
      const byNeglect = (a, b) => areaGap(b) - areaGap(a) || groupGap(b) - groupGap(a)
        || gap(b) - gap(a) || a.firstRow - b.firstRow;
      const tag = ex => Object.assign({}, ex, { suggest: areas[ex.area], suggestGroup: groups[ex.group] });
      const doneLast = list => list.filter(ex => !isDoneToday(ex)).concat(list.filter(isDoneToday));

      // 1. PT: every PT exercise still short of its weekly goal (as of this
      //    morning). Suggested when its area is ready and it wasn't done
      //    yesterday (PT needs a rest day); the rest are listed as still due.
      const ptOpen = all.filter(ex => ex.category === 'PT' && !inPlan.has(ex.key)
        && ex.weekDone - ex.slots.filter(slotToday).length < ex.weekTarget).sort(byNeglect);
      const restDay = ex => ex.slots.some(s => !s.noDate && s.days === 1);
      const ptOk = ptOpen.filter(ex => ready(ex) && !restDay(ex));
      const pt = ptOk.slice(0, SUGGEST_PT_MAX);
      const ptDue = ptOpen.filter(ex => !pt.includes(ex)).map(ex => Object.assign({}, ex, {
        why: !ready(ex) ? ex.area + ' resting until ' + areas[ex.area].until
          : restDay(ex) ? 'rest day (done yesterday)' : 'next up',
      }));

      // 2–3. Compound, then Isolation: one exercise per ready area not already
      //      covered above, from that area's most neglected group.
      const covered = new Set(pt.map(ex => ex.area));
      function onePerArea(category, max) {
        const best = {};
        all.filter(ex => ex.category === category && !inPlan.has(ex.key) && ready(ex) && !covered.has(ex.area))
          .forEach(ex => { if (!best[ex.area] || byNeglect(ex, best[ex.area]) < 0) best[ex.area] = ex; });
        const picks = Object.values(best).sort(byNeglect).slice(0, max);
        picks.forEach(ex => covered.add(ex.area));
        return picks;
      }
      const compound = onePerArea('Compound', SUGGEST_COMPOUND_MAX);
      const isolation = onePerArea('Isolation', SUGGEST_ISO_MAX);

      return {
        parts: [
          { name: 'PT', items: doneLast(pt.map(tag)), due: ptDue },
          { name: 'Compound', items: doneLast(compound.map(tag)) },
          { name: 'Isolation', items: doneLast(isolation.map(tag)) },
        ],
        resting: Object.values(areas).filter(a => !a.ready),
        // Ready areas, longest since trained first — the "direction" line.
        neglected: Object.values(areas).filter(a => a.ready)
          .sort((a, b) => effectiveDays(b.since) - effectiveDays(a.since)).slice(0, 3),
        unmapped: [...new Set(all.filter(ex => ex.area === 'Other').map(ex => ex.group))],
      };
    }

    let suggestOpen = true;

    // Tapping an area in "Longest since": its first suggested card, else its
    // first card in the Category view.
    function jumpToArea(area) {
      const sug = [...document.querySelectorAll('.section.suggest .ex')].find(c => c.dataset.area === area);
      if (sug) return flashCard(sug);
      if (sortMode !== 'category') setMode('category');
      const card = [...document.querySelectorAll('.section:not(.focus):not(.suggest) .ex')].find(c => c.dataset.area === area);
      if (card) flashCard(card);
    }

    function linkChip(text, onClick) {
      const b = el('button', 'jump', text);
      b.type = 'button';
      b.addEventListener('click', e => { e.stopPropagation(); onClick(); });
      return b;
    }

    function suggestSection(sections, hasPlan) {
      const sug = suggestedExercises(sections);
      const secEl = el('section', 'section wide suggest');
      const open = suggestOpen;
      if (!open) secEl.classList.add('collapsed');
      const head = el('div', 'section-head');
      const name = el('span', 'section-name', 'Suggested — today');
      name.append(el('span', 'chev', open ? '▾' : '▸'));
      const items = [].concat(...sug.parts.map(p => p.items));
      const done = items.filter(isDoneToday).length;
      head.append(name, el('span', 'section-count', items.length ? done + ' / ' + items.length + ' done' : ''));
      head.addEventListener('click', () => { suggestOpen = !open; render(); });
      secEl.append(head);

      const sinceText = a => a.since == null ? 'no log' : a.since + 'd';
      if (sug.neglected.length) {
        const due = el('div', 'rest-line due-line');
        due.append(el('b', '', 'Longest since: '));
        sug.neglected.forEach(a => due.append(linkChip(a.name + ' ' + sinceText(a), () => jumpToArea(a.name))));
        secEl.append(due);
      }
      const restParts = sug.resting.map(a => a.name + ' (until ' + a.until + ')');
      const rest = el('div', 'rest-line', restParts.length ? 'Resting: ' + restParts.join(' · ') : 'Everything is rested.');
      if (sug.unmapped.length) rest.append(el('span', 'unmapped', ' · Unmapped: ' + sug.unmapped.join(', ')));
      const editBtn = el('button', 'rest-edit-btn', restEditOpen ? 'Done' : 'Rest days ✎');
      editBtn.type = 'button';
      editBtn.addEventListener('click', () => { restEditOpen = !restEditOpen; restDraft = null; render(); });
      rest.append(editBtn);
      secEl.append(rest);
      if (restEditOpen) secEl.append(restEditor());

      sug.parts.forEach(part => {
        if (!part.items.length && !(part.due && part.due.length)) return;
        const sub = el('div', 'sub sug-sub');
        sub.append(el('span', '', part.name),
          el('span', '', part.items.filter(isDoneToday).length + ' / ' + part.items.length + ' done'));
        secEl.append(sub);
        part.items.forEach(ex => secEl.append(exerciseCard(ex, false)));
        if (part.due && part.due.length) {
          const line = el('div', 'rest-line pt-due');
          line.append(el('b', '', part.items.length ? 'Also due this week: ' : 'PT due this week: '));
          part.due.forEach(ex => line.append(linkChip(ex.name + ' — ' + ex.why, () => jumpTo(ex.key))));
          secEl.append(line);
        }
      });
      if (!items.length && !sug.parts[0].due.length) {
        secEl.append(el('p', 'empty', 'Nothing to suggest — every area is resting and this week\'s PT is done.'));
      }
      return secEl;
    }

    // ---------- Recovery days editor ----------
    // Draft edits stay local until Save; saved values live server-side
    // (saveAreaDays) and drive both suggestions and heat colors.
    let restEditOpen = false;
    let restDraft = null; // { areaName: days } while editing

    function restEditor() {
      const areas = data.areas || [];
      if (!restDraft) restDraft = Object.fromEntries(areas.map(a => [a.name, a.days]));
      const box = el('div', 'rest-edit');
      box.append(el('p', 'hint', 'Days an area rests before it\'s suggested again. Also sets the heat colors.'));
      areas.forEach(a => {
        const v = restDraft[a.name];
        const row = el('div', 'rest-row' + (v !== a.defaultDays ? ' changed' : ''));
        const minus = el('button', '', '−');
        const plus = el('button', '', '+');
        minus.type = plus.type = 'button';
        minus.disabled = v <= 1;
        plus.disabled = v >= 14;
        minus.addEventListener('click', () => { restDraft[a.name] = v - 1; render(); });
        plus.addEventListener('click', () => { restDraft[a.name] = v + 1; render(); });
        row.append(el('span', 'rest-name', a.name), el('span', 'rest-def', v !== a.defaultDays ? 'default ' + a.defaultDays : ''),
          minus, el('span', 'rest-val', v + 'd'), plus);
        box.append(row);
      });
      const actions = el('div', 'rest-actions');
      const dirty = areas.some(a => restDraft[a.name] !== a.days);
      const save = el('button', '', 'Save');
      const reset = el('button', '', 'Defaults');
      save.type = reset.type = 'button';
      save.disabled = !dirty;
      const msg = el('span', 'rest-msg', dirty ? 'Unsaved changes' : '');
      save.addEventListener('click', () => {
        save.disabled = true;
        msg.textContent = 'Saving…';
        google.script.run
          .withSuccessHandler(result => { data = result; restDraft = null; restEditOpen = false; render(); })
          .withFailureHandler(err => { msg.textContent = 'Error: ' + err.message; save.disabled = false; })
          .saveAreaDays(restDraft);
      });
      reset.addEventListener('click', () => {
        restDraft = Object.fromEntries(areas.map(a => [a.name, a.defaultDays]));
        render();
      });
      actions.append(save, reset, msg);
      box.append(actions);
      return box;
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function exerciseCard(ex, showTags) {
      const card = el('div', 'ex' + ((ex.plan || ex.suggest) && isDoneToday(ex) ? ' done' : '')
        + (ex.category === 'PT' && ex.met ? ' met' : ''));
      card.dataset.key = ex.key;
      card.dataset.area = ex.area || '';
      card.style.setProperty('--hue', heatHue(ex.days, ex.recoveryDays));
      card.append(el('div', 'ex-name', ex.name),
        el('span', 'pill', ex.noDate ? 'no date' : daysLabel(ex.days)));

      const meta = el('div', 'ex-meta');
      if (ex.suggest) {
        const a = ex.suggest;
        meta.append(el('span', 'tag area' + (a.name === 'Other' ? ' other' : ''),
          isDoneToday(ex) ? a.name + ' · ✓ done' : a.name + ' · ' + (a.since == null ? 'no log' : a.since + 'd since')));
        const g = ex.suggestGroup;
        if (g && g.name !== a.name && !isDoneToday(ex)) {
          meta.append(el('span', 'tag', g.name + ' · ' + (g.since == null ? 'no log' : g.since + 'd')));
        }
        meta.append(el('span', 'tag', ex.category));
      }
      if (showTags) meta.append(el('span', 'tag', ex.category), el('span', 'tag', ex.group));
      if (ex.freq) meta.append(el('span', 'tag', ex.freq));
      if (ex.plan) {
        const target = [ex.plan.target, ex.plan.weight].filter(Boolean).join(' @ ');
        meta.append(el('span', 'tag', isDoneToday(ex) ? '✓ done' : 'Plan' + (target ? ': ' + target : '')));
      }
      if (meta.childNodes.length) card.append(meta);
      const history = historyLine(ex);
      if (history) card.append(history);
      if (ex.plan && ex.plan.note) card.append(el('div', 'ex-note', ex.plan.note));
      card.append(logBox(ex));
      return card;
    }

    // Pinned "PT this week" strip: progress bar + one chip per PT exercise,
    // still-to-do first. Tap a chip to jump to that exercise.
    function renderPtStrip(sections) {
      const strip = document.getElementById('pt-strip');
      strip.innerHTML = '';
      const pt = (sections.find(s => s.name === 'PT') || { exercises: [] }).exercises;
      if (!pt.length) return;
      const met = pt.filter(ex => ex.met).length;

      // One box per PT exercise: full = weekly goal met, partly filled =
      // started but not there yet. Count = full boxes.
      const line = el('div', 'pt-line');
      const bar = segBar(pt.map(ex => Math.min(1, ex.weekDone / ex.weekTarget)), met === pt.length ? 'all' : '');
      // "0/9 done · 3 started" so the amber half-boxes are explained.
      const started = pt.filter(ex => !ex.met && ex.weekDone > 0).length;
      const count = el('span', 'pt-count');
      if (met === pt.length) count.textContent = 'all done ✓';
      else {
        count.append(document.createTextNode(met + '/' + pt.length + ' done'));
        if (started) count.append(el('span', 'started', ' · ' + started + ' started'));
      }
      line.append(el('span', 'pt-label', 'PT this week'), bar, count);
      strip.append(line);

      const chips = el('div', 'pt-chips');
      pt.slice()
        .sort((a, b) => a.met - b.met || a.weekDone / a.weekTarget - b.weekDone / b.weekTarget
          || b.days - a.days || a.firstRow - b.firstRow)
        .forEach(ex => {
          const chip = el('button', 'chip' + (ex.met ? ' met' : ex.weekDone ? ' partial' : ''));
          chip.type = 'button';
          chip.title = ex.name;
          chip.append(el('span', 'chip-name', (ex.met ? '✓ ' : '') + ex.name),
            el('span', 'chip-n', ex.weekDone + '/' + ex.weekTarget));
          chip.addEventListener('click', () => jumpTo(ex.key));
          chips.append(chip);
        });
      strip.append(chips);

      // Bonus: everything that isn't PT. Nice to have, not required.
      const extra = [].concat(...sections.filter(s => s.name !== 'PT').map(s => s.exercises));
      if (extra.length) {
        const hit = extra.filter(ex => ex.weekDone > 0).length;
        const bLine = el('div', 'pt-line bonus');
        const bBar = segBar(extra.map(ex => (ex.weekDone > 0 ? 1 : 0)), 'blue');
        bLine.append(el('span', 'pt-label', 'Bonus'), bBar,
          el('span', 'pt-count', hit ? '+' + hit + ' of ' + extra.length : '0 of ' + extra.length));
        strip.append(bLine);
      }
    }

    function jumpTo(key) {
      if (sortMode !== 'category') setMode('category');
      const card = [...document.querySelectorAll('.section:not(.focus):not(.suggest) .ex')].find(c => c.dataset.key === key);
      if (card) flashCard(card);
    }

    function flashCard(card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      card.classList.remove('flash');
      void card.offsetWidth; // restart the animation
      card.classList.add('flash');
    }

    function render() {
      const wrap = document.getElementById('groups');
      wrap.innerHTML = '';

      let sections = buildSections();
      renderPtStrip(sections);
      const all = [].concat(...sections.map(s => s.exercises));
      if (sortMode === 'days') {
        // One list, most days since first; exercises with no date at the bottom.
        all.sort((a, b) => b.days - a.days || a.noDate - b.noDate || a.firstRow - b.firstRow);
        sections = [{ name: 'Longest since first', exercises: all, wide: true }];
      } else if (sortMode === 'today') {
        const done = all.filter(isDoneToday);
        if (!done.length) {
          wrap.append(el('p', 'empty', 'Nothing logged yet today.'));
          return;
        }
        sections = [{ name: 'Done today', exercises: done, wide: true }];
      } else if (sortMode === 'plan') {
        const planned = plannedExercises(sections);
        if (!planned.length) {
          wrap.append(el('p', 'empty', 'No plan for today yet. Ask Claude for one.'));
          return;
        }
        sections = [{ name: "Today's plan", exercises: planned, wide: true, focus: true }];
      }

      // Focus: today's plan bubbles to the top of the Category and Days views,
      // then Suggested (collapsed when a confirmed plan exists — the plan wins).
      let suggestEl = null;
      if (sortMode === 'category' || sortMode === 'days') {
        const base = buildSections();
        const planned = plannedExercises(base);
        if (planned.length) sections.unshift({ name: 'Focus — today', exercises: planned, wide: true, focus: true });
        suggestEl = suggestSection(base, planned.length > 0);
      }

      sections.forEach(sec => {
        const exercises = sec.exercises;
        const countText = sortMode === 'today'
          ? exercises.length + ' done'
          : sec.focus
          ? exercises.filter(isDoneToday).length + ' / ' + exercises.length + ' done'
          : weekCount(exercises) + ' this week';
        const secEl = el('section', 'section' + (sec.wide ? ' wide' : '') + (sec.focus ? ' focus' : ''));
        const head = el('div', 'section-head');
        head.append(el('span', 'section-name', sec.name), el('span', 'section-count', countText));
        secEl.append(head);

        const byGroup = sortMode === 'category' && !sec.focus;
        if (byGroup) {
          // Subheadings per muscle group (column A), groups in sheet order.
          const order = [];
          exercises.forEach(ex => { if (!order.includes(ex.group)) order.push(ex.group); });
          order.forEach(g => {
            const list = exercises.filter(ex => ex.group === g);
            const sub = el('div', 'sub');
            sub.append(el('span', '', g), el('span', '', weekCount(list)));
            secEl.append(sub);
            list.forEach(ex => secEl.append(exerciseCard(ex, false)));
          });
        } else {
          exercises.forEach(ex => secEl.append(exerciseCard(ex, true)));
        }
        wrap.append(secEl);
        if (sec.focus && suggestEl) { wrap.append(suggestEl); suggestEl = null; }
      });
      if (suggestEl) wrap.prepend(suggestEl);
    }

    function setMode(mode) {
      sortMode = mode;
      document.querySelectorAll('.controls button').forEach(b => b.classList.toggle('active', b.dataset.sort === mode));
      if (data) render();
    }

    document.querySelectorAll('.controls button').forEach(btn => {
      btn.addEventListener('click', () => {
        setMode(btn.dataset.sort);
        window.scrollTo(0, 0);
      });
    });

    // ---------- Notes panel ----------
    const notesStatus = t => { document.getElementById('notes-status').textContent = t; };

    function renderNotes(notes) {
      const list = document.getElementById('notes-list');
      list.innerHTML = '';
      notesStatus(notes.length ? notes.length + ' note' + (notes.length === 1 ? '' : 's') : 'No notes yet.');
      notes.slice().reverse().forEach(n => {
        const li = el('li');
        const del = el('button', '', '✕');
        del.type = 'button';
        del.title = 'Remove';
        del.addEventListener('click', () => {
          if (!confirm('Remove this note?')) return;
          notesStatus('Removing…');
          google.script.run.withSuccessHandler(renderNotes)
            .withFailureHandler(err => notesStatus('Error: ' + err.message))
            .removeNote(n.i, n.text);
        });
        li.append(el('span', '', n.text), del);
        list.append(li);
      });
    }

    function openNotes() {
      document.body.classList.add('notes-open');
      notesStatus('Loading…');
      google.script.run.withSuccessHandler(renderNotes)
        .withFailureHandler(err => notesStatus('Error: ' + err.message))
        .getNotes();
    }

    const closeNotes = () => document.body.classList.remove('notes-open');
    document.getElementById('notes-open').addEventListener('click', openNotes);
    document.getElementById('notes-close').addEventListener('click', closeNotes);
    document.getElementById('notes-shade').addEventListener('click', closeNotes);
    document.getElementById('notes-form').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('notes-input');
      const text = input.value.trim();
      if (!text) return;
      notesStatus('Saving…');
      google.script.run
        .withSuccessHandler(notes => { input.value = ''; renderNotes(notes); })
        .withFailureHandler(err => notesStatus('Error: ' + err.message))
        .addNote(text);
    });

    google.script.run
      .withSuccessHandler(result => {
        data = result;
        setStatus(mergeDupes(sheetRows()).length + ' exercises');
        render();
      })
      .withFailureHandler(err => setStatus('Error: ' + err.message))
      .getTrackerData();
  </script>
</body>

</html>
