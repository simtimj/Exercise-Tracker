      appendSuggestTree(secEl, sug, ex => open ? exerciseCard(ex, false, true) : pickRow(ex, pickMeta(ex)));

      if (!items.length) {
        secEl.append(el('p', 'empty', 'Nothing to suggest — every area is resting and this week\'s PT is done.'));
      }
      return boxGroups(secEl);
    }

    // Up next: picked for a later session. Move to today, or remove.
    function upNextSection(list) {
      const secEl = el('section', 'section wide upnext');
      secEl.id = 'next-sec';
      const head = el('div', 'section-head');
      head.append(el('span', 'section-name', 'Up next'), el('span', 'section-count', String(list.length)));
      secEl.append(head);
      if (!list.length) secEl.append(el('p', 'empty small', 'Nothing queued. Tick suggestions, then tap Up next.'));
      list.forEach(ex => {
        const row = el('div', 'pick-row next-row' + (isDoneToday(ex) ? ' done' : ''));
        row.dataset.key = ex.key;
        row.style.setProperty('--hue', heatHue(ex.days, ex.recoveryDays));
        const nm = el('button', 'pr-name link', (isDoneToday(ex) ? '✓ ' : '') + ex.name);
        nm.type = 'button';
        nm.addEventListener('click', () => jumpTo(ex.key));
        const toToday = el('button', 'mini', 'Today');
        const del = el('button', 'mini', '✕');
        toToday.type = del.type = 'button';
        del.title = 'Remove from Up next';
        toToday.addEventListener('click', () => savePicks(movePicks([ex.key], 'today'), 'Moved to today: ' + ex.name));
        del.addEventListener('click', () => savePicks(movePicks([ex.key], null), 'Removed: ' + ex.name));
        row.append(nm, el('span', 'pr-meta', pvMeta(ex)), toToday, del);
        secEl.append(row);
      });
      return secEl;
    }

    // ---------- This week: honest summary + plain-English suggestions ----------
    // Counts only what was actually logged in the last SUMMARY_DAYS days:
    // the saved log history (data.history, "YYYY-MM-DD|row", from each Log)
    // plus each sheet row's latest date. Praise scales with the real amount.
    const SUMMARY_DAYS = 7;
    const OVERDUE_DAYS = 7; // an area untouched this long gets called out
    const AREA_WORDS = { 'Glutes/Hips': 'glutes and hips', Legs: 'legs', Core: 'core', Back: 'back',
      Push: 'chest and shoulders', Arms: 'arms', Other: 'other exercises' };
    const AREA_DETAIL = { Arms: 'biceps, triceps', Back: 'rows, pull-ups, rear delts', Push: 'chest, shoulders',
      Legs: 'quads, hamstrings, calves', 'Glutes/Hips': 'glutes, hips', Core: 'core stability, abs' };

    function isoMinusDays(iso, n) {
      const [y, m, d] = iso.split('-').map(Number);
      const t = new Date(y, m - 1, d - n);
      return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
    }

    function listText(items) {
      if (items.length <= 1) return items.join('');
      return items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
    }

    // Distinct logs (date + sheet row) in the window, each with its exercise.
    function recentLogs(all) {
      const byRow = {};
      all.forEach(ex => ex.slots.forEach(s => { byRow[s.row] = ex; }));
      const from = isoMinusDays(data.today, SUMMARY_DAYS - 1);
      const seen = new Set();
      (data.history || []).forEach(e => {
        const [d, r] = String(e).split('|');
        if (d >= from && d <= data.today && byRow[r]) seen.add(d + '|' + r);
      });
      all.forEach(ex => ex.slots.forEach(s => { if (!s.noDate && s.lastDate >= from) seen.add(s.lastDate + '|' + s.row); }));
      return [...seen].map(k => { const [d, r] = k.split('|'); return { date: d, ex: byRow[r] }; });
    }

    function amountWords(n) {
      return n >= 6 ? 'a lot of work on' : n >= 3 ? 'a decent amount of work on' : 'a little work on';
    }

    function weekSummary(sections) {
      const all = [].concat(...sections.map(s => s.exercises));
      const logs = recentLogs(all);
      const sug = suggestedExercises(sections);

      // Per area: logs and distinct days in the window.
      const byArea = {};
      logs.forEach(l => {
        const a = byArea[l.ex.area] || (byArea[l.ex.area] = { name: l.ex.area, n: 0, days: new Set() });
        a.n++;
        a.days.add(l.date);
      });
      const worked = Object.values(byArea).sort((a, b) => b.n - a.n);

      // Days since each area was trained, today included.
      const since = {};
      all.forEach(ex => ex.slots.forEach(s => {
        if (s.noDate) { if (!(ex.area in since)) since[ex.area] = null; return; }
        if (since[ex.area] == null || s.days < since[ex.area]) since[ex.area] = s.days;
      }));

      const good = [];
      const tips = [];
      const total = logs.length;
      if (!total) {
        good.push({ head: 'Nothing logged yet', body: 'Nothing in the last ' + SUMMARY_DAYS + ' days. No judgment — today is a good day to restart, PT first.' });
      } else {
        const parts = worked.map(a => amountWords(a.n) + ' ' + AREA_WORDS[a.name] + ' (' + a.n + ' exercise'
          + (a.n === 1 ? '' : 's') + ', ' + a.days.size + ' day' + (a.days.size === 1 ? '' : 's') + ')');
        good.push({ head: (total >= 6 ? 'Nice' : total >= 3 ? 'Good work' : 'Good start') + ' — ' + total + ' exercise' + (total === 1 ? '' : 's') + ' logged',
          body: 'You put in ' + listText(parts) + '.' });
      }

      // PT: praise only what's real; what's missing goes to suggestions.
      const pt = (sections.find(s => s.name === 'PT') || { exercises: [] }).exercises;
      const met = pt.filter(ex => ex.met).length;
      const started = pt.filter(ex => !ex.met && ex.weekDone > 0).length;
      if (pt.length && met === pt.length) good.push({ head: 'All PT done', body: 'Every PT exercise hit its goal this week — great consistency.' });
      else if (met || started) {
        const sd = pt.reduce((n, ex) => n + Math.min(ex.weekDone, ex.weekTarget), 0);
        const st = pt.reduce((n, ex) => n + ex.weekTarget, 0);
        good.push({ head: 'PT ' + sd + ' of ' + st + ' sessions done',
          body: (met ? met + ' of ' + pt.length + ' exercises finished for the week' : 'None finished yet')
            + (started ? ', ' + started + ' more started.' : '.') });
      }

      // Suggestions, most important first.
      const owed = sug.pt.filter(ex => !isDoneToday(ex));
      if (owed.length) {
        const now = owed.filter(ex => !ex.why).slice(0, 2).map(ex => ex.name);
        tips.push({ head: 'PT first — ' + owed.length + ' still owed',
          body: (now.length ? 'Start with ' + listText(now) + '.' : 'Those areas are resting today, so pick them up when they\'re ready.') });
      } else if (pt.length && met < pt.length) {
        tips.push({ head: 'PT on track today', body: 'The rest is due after a rest day.' });
      }

      const overdue = Object.keys(since).filter(a => a !== 'Other' && (since[a] == null || since[a] >= OVERDUE_DAYS))
        .sort((a, b) => effectiveDays(since[b]) - effectiveDays(since[a])).slice(0, 2);
      overdue.forEach(a => {
        const block = sug.blocks.find(b => b.area.name === a);
        const tryNames = block ? block.items.map(ex => ex.name) : [];
        const label = AREA_WORDS[a].charAt(0).toUpperCase() + AREA_WORDS[a].slice(1);
        tips.push({ head: label + ' — ' + (since[a] == null ? 'no log yet' : since[a] + ' days'),
          body: (AREA_DETAIL[a] ? AREA_DETAIL[a].charAt(0).toUpperCase() + AREA_DETAIL[a].slice(1) + '. ' : '')
            + (tryNames.length ? 'Try ' + (tryNames.length === 1 ? tryNames[0]
              : tryNames.slice(0, -1).join(', ') + ' or ' + tryNames[tryNames.length - 1]) + '.' : '') });
      });

      // Lopsided week: one area is half or more of the work.
      if (total >= 4 && worked[0].n / total > 0.5 && overdue.length) {
        tips.push({ head: 'Even it out', body: 'Most of your recent work has been ' + AREA_WORDS[worked[0].name] + ' — mixing in '
          + AREA_WORDS[overdue[0]] + ' would balance things.' });
      }
      if (!tips.length) tips.push({ head: 'Nothing overdue', body: 'Keep following Suggested.' });
      return { good, tips };
    }

    // Folded state is remembered per device (localStorage, best-effort).
    let summaryOpen = true;
    try { summaryOpen = localStorage.getItem('summaryOpen') !== '0'; } catch (e) {}

    // One summary point: bold underlined main idea, details underneath.
    function sumLine(t) {
      const p = el('div', 'sum-line');
      p.append(el('strong', 'key', t.head));
      if (t.body) p.append(el('div', 'sum-body', t.body));
      return p;
    }

    // ---------- Why PT (Julius, 2026-10-25) ----------
    // Plain-English reasons for the PT block, shown at the top of Full view.
    // Keyed by PT muscle group (column A). Edit the text here.
    const PT_WHY_GOAL = {
      head: 'Goal: take the load off the lower back',
      body: 'Lower back, hip flexors and the right-side QL get tight from sitting a lot. '
        + 'Weak glutes (especially glute medius) let the low back and QL do work the hips should do. '
        + 'PT builds the hips and core back up so the back can relax. PT comes first every week.',
    };
    const PT_WHY = {
      'Glute Max': 'Main hip extensor. Sitting all day weakens it, so the lower back takes over when you stand up, lift or hinge. Strong glutes = less low back strain.',
      'Glute Med': 'Holds the pelvis level when you stand on one leg (every step). When it is weak, the hip drops and the QL hikes it back up — a big reason the right QL stays tight. The main rehab target.',
      'Hamstrings': 'Teaches a clean hip hinge, so bending and lifting come from the hips, not the low back. Single-leg versions also make glute med work for balance.',
      'Quads': 'Single-leg strength and knee control. Split squats also stretch the back leg\'s hip flexor, which gets tight from sitting.',
      'Core': 'Keeps the spine still while arms and legs move (anti-extension and anti-rotation), so the low back and QL don\'t have to brace for everything.',
    };
    let whyOpen = true;
    try { whyOpen = localStorage.getItem('whyOpen') !== '0'; } catch (e) {}

    function whySection(sections) {
      const pt = (sections.find(s => s.name === 'PT') || { exercises: [] }).exercises;
      const secEl = el('section', 'section wide summary why');
      secEl.id = 'why-sec';
      const head = el('div', 'section-head');
      const name = el('span', 'section-name', 'Why PT');
      name.append(el('span', 'chev', whyOpen ? ' ▾' : ' ▸'));
      head.append(name, el('span', 'section-count', 'low back · QL · glutes'));
      head.style.cursor = 'pointer';
      head.addEventListener('click', () => {
        whyOpen = !whyOpen;
        try { localStorage.setItem('whyOpen', whyOpen ? '1' : '0'); } catch (e) {}
        render();
      });
      secEl.append(head);
      secEl.append(sumLine(whyOpen ? PT_WHY_GOAL : { head: PT_WHY_GOAL.head }));
      if (!whyOpen) return secEl;
      const groups = [];
      pt.forEach(ex => { if (!groups.includes(ex.group)) groups.push(ex.group); });
      groups.forEach(g => {
        const names = pt.filter(ex => ex.group === g).map(ex => ex.name).join(', ');
        const sub = el('div', 'sub');
        sub.append(el('span', '', g), el('span', 'sub-rest', names));
        secEl.append(sub);
        secEl.append(sumLine({ head: '', body: PT_WHY[g] || 'No reason written yet.' }));
      });
      return boxGroups(secEl);
    }

    function summarySection(sections) {
      const sum = weekSummary(sections);
      const secEl = el('section', 'section wide summary');
      secEl.id = 'summary-sec';
      const head = el('div', 'section-head');
      const name = el('span', 'section-name', 'This week');
      name.append(el('span', 'chev', summaryOpen ? ' ▾' : ' ▸'));
      head.append(name, el('span', 'section-count', 'last ' + SUMMARY_DAYS + ' days'));
      head.style.cursor = 'pointer';
      head.addEventListener('click', () => {
        summaryOpen = !summaryOpen;
        try { localStorage.setItem('summaryOpen', summaryOpen ? '1' : '0'); } catch (e) {}
        render();
      });
      secEl.append(head);
      if (!summaryOpen) {
        // Folded: just the top suggestion.
        secEl.append(sumLine(sum.tips[0]));
        return secEl;
      }
      // Going well was dropped (Julius, 2026-10-25) — suggestions only.
      [['Suggestions', sum.tips]].forEach(([label, lines]) => {
        if (!lines.length) return;
        const sub = el('div', 'sub');
        sub.append(el('span', '', label));
        secEl.append(sub);
        lines.forEach(t => secEl.append(sumLine(t)));
      });
      return boxGroups(secEl);
    }

    // ---------- Recovery days editor ----------
    // Draft edits stay local until Save; saved values live server-side
    // (saveAreaDays) and drive both suggestions and heat colors.
    let restEditOpen = false;
    let restDraft = null; // { areaName: days } while editing

    function restEditor() {
      const areas = data.areas || [];
      if (!restDraft) restDraft = Object.fromEntries(areas.map(a => [a.name, a.days]));
      const box = el('div', 'rest-edit');
      box.append(el('p', 'hint', 'Days an area rests before it\'s suggested again. Also sets the heat colors.'));
      areas.forEach(a => {
        const v = restDraft[a.name];
        const row = el('div', 'rest-row' + (v !== a.defaultDays ? ' changed' : ''));
        const minus = el('button', '', '−');
        const plus = el('button', '', '+');
        minus.type = plus.type = 'button';
        minus.disabled = v <= 1;
        plus.disabled = v >= 14;
        minus.addEventListener('click', () => { restDraft[a.name] = v - 1; render(); });
        plus.addEventListener('click', () => { restDraft[a.name] = v + 1; render(); });
        row.append(el('span', 'rest-name', a.name), el('span', 'rest-def', v !== a.defaultDays ? 'default ' + a.defaultDays : ''),
          minus, el('span', 'rest-val', v + 'd'), plus);
        box.append(row);
      });
      const actions = el('div', 'rest-actions');
      const dirty = areas.some(a => restDraft[a.name] !== a.days);
      const save = el('button', '', 'Save');
      const reset = el('button', '', 'Defaults');
      save.type = reset.type = 'button';
      save.disabled = !dirty;
      const msg = el('span', 'rest-msg', dirty ? 'Unsaved changes' : '');
      save.addEventListener('click', () => {
        save.disabled = true;
        msg.textContent = 'Saving…';
        google.script.run
          .withSuccessHandler(result => { data = result; restDraft = null; restEditOpen = false; render(); })
          .withFailureHandler(err => { msg.textContent = 'Error: ' + err.message; save.disabled = false; })
          .saveAreaDays(restDraft);
      });
      reset.addEventListener('click', () => {
        restDraft = Object.fromEntries(areas.map(a => [a.name, a.defaultDays]));
        render();
      });
      actions.append(save, reset, msg);
      box.append(actions);
      return box;
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    // ---------- Exercise pictures (2026-10-25) ----------
    // Public-domain photos from free-exercise-db (github.com/yuhonas/free-exercise-db).
    // Key = start of the exercise name (lowercase), value = that db's exercise id
    // (or a full https URL to use your own picture). Empty = no good match yet.
    // Julius will swap any that look wrong.
    // Simple line drawings (made here, no license needed) for exercises the
    // photo set doesn't have. Start, end.
    const DRAWN_IMAGES = {
      bird_dog: [
        'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140"><rect width="200" height="140" fill="%23f3f1f7"/><line x1="8" y1="118" x2="192" y2="118" stroke="%23c9c3d6" stroke-width="3" stroke-linecap="round"/><g fill="none" stroke="%233b3550" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><g stroke="%239a92b0"><polyline points="128,66 129,114"/><polyline points="80,66 82,114 46,114"/></g><polyline points="72,66 135,66"/><circle cx="152" cy="58" r="10" fill="%233b3550" stroke="none"/><polyline points="135,66 137,114"/><polyline points="72,66 74,114 38,114"/></g></svg>',
        'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140"><rect width="200" height="140" fill="%23f3f1f7"/><line x1="8" y1="118" x2="192" y2="118" stroke="%23c9c3d6" stroke-width="3" stroke-linecap="round"/><g fill="none" stroke="%233b3550" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><g stroke="%239a92b0"><polyline points="128,66 129,114"/><polyline points="80,66 82,114 46,114"/></g><polyline points="72,66 135,66"/><circle cx="150" cy="52" r="10" fill="%233b3550" stroke="none"/><polyline points="135,66 190,72"/><polyline points="72,66 14,60"/></g></svg>',
      ],
      clam_shells: [
        'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140"><rect width="200" height="140" fill="%23f3f1f7"/><line x1="8" y1="118" x2="192" y2="118" stroke="%23c9c3d6" stroke-width="3" stroke-linecap="round"/><g fill="none" stroke="%233b3550" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="96" r="10" fill="%233b3550" stroke="none"/><polyline points="44,104 36,116"/><polyline points="44,104 112,104"/><g stroke="%239a92b0"><polyline points="112,108 162,96 122,114"/></g><polyline points="112,104 162,92 122,112"/></g></svg>',
        'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140"><rect width="200" height="140" fill="%23f3f1f7"/><line x1="8" y1="118" x2="192" y2="118" stroke="%23c9c3d6" stroke-width="3" stroke-linecap="round"/><g fill="none" stroke="%233b3550" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="96" r="10" fill="%233b3550" stroke="none"/><polyline points="44,104 36,116"/><polyline points="44,104 112,104"/><g stroke="%239a92b0"><polyline points="112,108 162,96 122,114"/></g><polyline points="112,104 150,52 122,110"/></g></svg>',
      ],
    };
    const IMG_BASE = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
    const EX_IMAGES = {
      '1 leg weighted glute bridge': 'Single_Leg_Glute_Bridge',
      'side lying hip abduction': 'Side_Leg_Raises',
      'lateral band walks': 'Monster_Walk',
      'clam shells': DRAWN_IMAGES.clam_shells,
      'romanian deadlift': 'Romanian_Deadlift',
      'bulgarian split squat': 'Split_Squat_with_Dumbbells',
      'weighted step ups': 'Dumbbell_Step_Ups',
      'dead bugs': 'Dead_Bug',
      'bird dog': DRAWN_IMAGES.bird_dog,
      'pull ups': 'Pullups',
      'barbell row': 'Bent_Over_Barbell_Row',
      'one-arm dumbbell row': 'One-Arm_Dumbbell_Row',
      'rear delt flys': 'Reverse_Flyes',
      'squat': 'Barbell_Squat',
      'walking lunge': 'Bodyweight_Walking_Lunge',
      'bench press': 'Barbell_Bench_Press_-_Medium_Grip',
      'incline bench press': 'Barbell_Incline_Bench_Press_-_Medium_Grip',
      'dips': 'Dips_-_Chest_Version',
      'overhead press': 'Standing_Military_Press',
      'lateral raise': 'Side_Lateral_Raise',
      'decline crunch': 'Decline_Crunch',
      'ab wheel': 'Ab_Roller',
      'plank': 'Plank',
      'hanging knee raise': 'Hanging_Leg_Raise',
      'side plank': 'Side_Bridge',
      'bicep curl': 'Dumbbell_Bicep_Curl',
      'triceps extension': 'Cable_Rope_Overhead_Triceps_Extension',
      'weighted calf raise': 'Standing_Dumbbell_Calf_Raise',
    };
    // Longest key the name starts with; else longest key it contains.
    function imageFor(name) {
      const n = String(name || '').toLowerCase().replace(/\s+/g, ' ').trim();
      const keys = Object.keys(EX_IMAGES).sort((a, b) => b.length - a.length);
      const k = keys.find(k => n.startsWith(k)) || keys.find(k => n.includes(k));
      const v = k ? EX_IMAGES[k] : '';
      if (!v) return null;
      if (Array.isArray(v)) return v;
      if (/^https?:/.test(v)) return [v];
      return [IMG_BASE + v + '/0.jpg', IMG_BASE + v + '/1.jpg']; // start, end positions
    }

    // Small picture left of the name; tap for start + end positions.
    function exThumb(ex) {
      const imgs = imageFor(ex.name);
      const box = el('span', 'thumb' + (imgs ? '' : ' none'));
      if (imgs) {
        const img = el('img');
        img.src = imgs[0];
        img.alt = '';
        img.loading = 'lazy';
        if (imgs[0].startsWith('data:')) box.classList.add('drawn');
        img.onerror = () => { box.classList.add('none'); img.remove(); };
        box.append(img);
      } else box.title = 'No picture yet';
      box.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        if (imgs) showPictures(ex.name, imgs);
      });
      return box;
    }

    function showPictures(name, imgs) {
      const shade = el('div', 'pic-shade');
      const card = el('div', 'pic-card');
      card.append(el('div', 'pic-title', name));
      const row = el('div', 'pic-row');
      imgs.forEach((src, i) => {
        const fig = el('figure');
        const img = el('img');
        img.src = src;
        img.alt = name;
        fig.append(img);
        if (imgs.length > 1) fig.append(el('figcaption', '', i ? 'End' : 'Start'));
        row.append(fig);
      });
      card.append(row);
      shade.append(card);
      shade.addEventListener('click', () => shade.remove());
      document.body.append(shade);
    }

    function exerciseCard(ex, showTags, pickable) {
      const card = el('div', 'ex' + ((ex.plan || ex.suggest) && isDoneToday(ex) ? ' done' : '')
        + (ex.category === 'PT' && ex.met ? ' met' : '') + (pickable && picked.has(ex.key) ? ' sel' : ''));
      card.dataset.key = ex.key;
      card.dataset.area = ex.area || '';
      card.style.setProperty('--hue', heatHue(ex.days, ex.recoveryDays));
      const nameEl = el('div', 'ex-name');
      nameEl.append(exThumb(ex));
      if (pickable) {
        const lab = el('label', 'pick');
        lab.append(pickBox(ex), document.createTextNode(ex.name));
        nameEl.append(lab);
      } else nameEl.append(el('span', '', ex.name));
      // Right column: days since, then the one-tap Today / Next buttons.
      const side = el('div', 'side');
      side.append(el('span', 'pill', ex.noDate ? 'no date' : daysLabel(ex.days)));
      card.append(nameEl, side);

      const meta = el('div', 'ex-meta');
      if (ex.suggest) {
        const a = ex.suggest;
        meta.append(el('span', 'tag area' + (a.name === 'Other' ? ' other' : ''),
          isDoneToday(ex) ? a.name + ' · ✓ done' : a.name + ' · ' + sinceText(a.since)));
        const g = ex.suggestGroup;
        if (g && g.name !== a.name && !isDoneToday(ex)) {
          meta.append(el('span', 'tag', g.name + ' · ' + sinceText(g.since)));
        }
        meta.append(el('span', 'tag', ex.category));
        if (ex.why && !isDoneToday(ex)) meta.append(el('span', 'tag later', 'Later · ' + ex.why));
      }
      if (showTags) meta.append(el('span', 'tag', ex.category), el('span', 'tag', areaGroup(ex)));
      if (ex.freq) meta.append(el('span', 'tag', ex.freq));
      if (ex.plan) {
        const target = [ex.plan.target, ex.plan.weight].filter(Boolean).join(' @ ');
        meta.append(el('span', 'tag', isDoneToday(ex) ? '✓ done' : (ex.plan.picked ? 'Picked' : 'Plan') + (target ? ': ' + target : '')));
        if (ex.plan.picked && !isDoneToday(ex)) {
          // Right column (under the days): → Next moves it to Up next, ✕ takes it off Today.
          const box = el('div', 'quick');
          box.append(pvButton('→ Next', 'Move to Up next', () => savePicks(movePicks([ex.key], 'next'), 'Up next: ' + ex.name)),
            pvButton('✕', 'Remove from today', () => savePicks(movePicks([ex.key], null), 'Removed: ' + ex.name)));
          side.append(box);
        }
      }
      if (meta.childNodes.length) card.append(meta);
      if (!ex.plan) side.append(quickAdd(ex));
      const history = historyLine(ex);
      if (history) card.append(history);
      if (ex.plan && ex.plan.note) card.append(el('div', 'ex-note', ex.plan.note));
      card.append(logBox(ex));
      return card;
    }

    // Pinned "PT this week" strip: progress bar + one chip per PT exercise,
    // still-to-do first. Tap a chip to jump to that exercise.
    // ---------- This week grids: PT, Compound, Isolation (2026-10-25) ----------
    // One grid per category, picked with the small tabs in the sticky header.
    // Groups are laid out by body part: names in `order` sit two per row,
    // names in `solo` get a row to themselves. Unknown groups go last.
    const GRID_LAYOUT = {
      PT: { order: ['Core', 'Glute Max', 'Glute Med', 'Hamstrings', 'Quads'], solo: ['Core'] },
      Compound: { order: ['Lats', 'Upper Back', 'Chest', 'Shoulders', 'Quads'], solo: ['Quads'] },
      Isolation: { order: ['Upper Abs', 'Middle Abs', 'Lower Abs', 'Obliques', 'Biceps', 'Triceps',
        'Shoulders', 'Rear Delts', 'Upper Back', 'Calves'], solo: [] },
    };
    const GRID_CATS = ['PT', 'Compound', 'Isolation'];
    let gridCat = 'PT';
    try { gridCat = localStorage.getItem('gridCat') || 'PT'; } catch (e) {}
    if (!GRID_CATS.includes(gridCat)) gridCat = 'PT';
    let gridOpen = null; // null, '*' (the whole category) or a group name

    // Sessions this week: an exercise done 2×/wk counts twice.
    const sessOf = list => ({
      done: list.reduce((n, ex) => n + Math.min(ex.weekDone, ex.weekTarget), 0),
      total: list.reduce((n, ex) => n + ex.weekTarget, 0),
    });

    function gridGroups(cat, list) {
      const lay = GRID_LAYOUT[cat] || { order: [], solo: [] };
      const rank = g => { const i = lay.order.indexOf(g); return i < 0 ? 99 : i; };
      const groups = [];
      list.forEach(ex => { if (!groups.includes(ex.group)) groups.push(ex.group); });
      return groups.sort((x, y) => rank(x) - rank(y))
        .map(g => ({ name: g, solo: lay.solo.includes(g), list: list.filter(ex => ex.group === g) }));
    }

    // Freshness, by days since vs the area's recovery days:
    //   red    = just trained, still recovering — leave it
    //   yellow = recovered, fine to do
    //   green  = going stale / falling behind — do this one
    function freshOf(days, rec) {
      rec = rec || 2;
      if (days < rec) return { cls: 'f-red', label: days === 0 ? 'done today' : 'resting' };
      if (days < Math.max(rec * 2, rec + 2)) return { cls: 'f-yellow', label: 'ready' };
      return { cls: 'f-green', label: 'falling behind' };
    }
    const freshDot = f => { const d = el('span', 'fdot ' + f.cls); d.title = f.label; return d; };
    const groupFresh = list => {
      const days = Math.min(...list.map(ex => ex.days));
      return Object.assign(freshOf(days, list[0].recoveryDays), { days });
    };

    // Short names for the grid labels (full name stays in the tap panel).
    // Order matters: more specific patterns first.
    const SHORT_NAMES = [
      [/glute bridge/i, 'Bridge'], [/romanian|\brdl\b/i, 'RDL'], [/bulgarian/i, 'BSS'],
      [/step ?ups?/i, 'Step up'], [/side ?lying/i, 'Side-lying'], [/band walk/i, 'Band walk'],
      [/clam/i, 'Clams'], [/dead ?bug/i, 'Dead bug'], [/bird ?dog/i, 'Bird dog'],
      [/pull ?ups?/i, 'Pull up'], [/incline/i, 'Incline'], [/bench press/i, 'Bench'],
      [/one-?arm/i, '1-arm row'], [/barbell row/i, 'Row'], [/overhead press/i, 'OHP'],
      [/walking lunge/i, 'Lunge'], [/^squat/i, 'Squat'], [/ab wheel/i, 'Ab wheel'],
      [/hanging knee/i, 'Knee raise'], [/decline crunch/i, 'Crunch'], [/side plank/i, 'Side plank'],
      [/lateral raise/i, 'Lat raise'], [/bicep curl/i, 'Curl'], [/tricep.*ext/i, 'Tri ext'],
      [/calf/i, 'Calf raise'], [/rear delt/i, 'Rear fly'],
    ];
    function shortName(name) {
      const hit = SHORT_NAMES.find(([re]) => re.test(name));
      if (hit) return hit[1];
      const words = String(name).replace(/\(.*?\)/g, '').replace(/[.\s]+$/, '').trim().split(/\s+/);
      return words.slice(0, 2).join(' ');
    }

    // One line per exercise: short name + one box per session in its weekly goal.
    function exLines(list) {
      const box = el('div', 'gx-list');
      list.forEach(ex => {
        // Loaded into Today and not done yet: the session he's about to do gets a
        // purple "planned" cell (Today's color, not a freshness color).
        const planned = todayKeys.has(ex.key) && ex.days !== 0;
        const line = el('div', 'gx' + (ex.met ? ' met' : '') + (planned ? ' planned' : ''));
        line.title = ex.name + (planned ? ' · in Today' : '');
        const cells = el('span', 'gx-cells');
        const nextCell = Math.min(ex.weekDone, ex.weekTarget - 1);
        for (let i = 0; i < ex.weekTarget; i++) {
          const full = i < ex.weekDone;
          const plan = planned && (full ? (ex.weekDone >= ex.weekTarget && i === nextCell) : i === nextCell);
          cells.append(el('span', 'seg' + (full ? ' full' : '') + (plan ? ' plan' : '')));
        }
        line.append(el('span', 'gx-name', (ex.met ? '✓ ' : '') + shortName(ex.name)), cells);
        box.append(line);
      });
      return box;
    }

    // One cluster per exercise, one box per session in its weekly goal.
    function clusterBar(list, allMet) {
      const bar = el('div', 'seg-bar clusters' + (allMet ? ' all' : ''));
      list.forEach(ex => {
        const c = el('span', 'seg-cluster');
        c.style.setProperty('--n', ex.weekTarget);
        for (let i = 0; i < ex.weekTarget; i++) c.append(el('span', 'seg' + (i < ex.weekDone ? ' full' : '')));
        bar.append(c);
      });
      return bar;
    }

    // Details panel under the grid: one group, or the whole category ('*').
    function gridDetail(cat, groups) {
      const box = el('div', 'pt-detail');
      const head = el('div', 'pt-detail-head');
      const shown = gridOpen === '*' ? groups : groups.filter(g => g.name === gridOpen);
      const all = [].concat(...shown.map(g => g.list));
      const t = sessOf(all);
      head.append(el('span', 'pt-detail-title', (gridOpen === '*' ? 'All ' + cat : gridOpen)
        + ' · ' + t.done + ' of ' + t.total + ' this week'));
      const close = el('button', 'q-btn', '✕');
      close.type = 'button';
      close.title = 'Close';
      close.addEventListener('click', () => { gridOpen = null; render(); });
      head.append(close);
      box.append(head);
      const line = ex => {
        const r = el('div', 'pt-detail-row' + (ex.met ? ' met' : ''));
        r.dataset.key = ex.key;
        const f = freshOf(ex.days, ex.recoveryDays);
        const txt = el('span', 'pt-detail-text');
        const owe = ex.weekTarget - Math.min(ex.weekDone, ex.weekTarget);
        txt.append(el('span', 'pt-detail-name', (ex.met ? '✓ ' : '') + ex.name),
          el('span', 'pt-detail-meta', ex.weekDone + '/' + ex.weekTarget
            + (ex.met ? ' · done' : ' · ' + owe + ' left') + ' · '
            + (ex.noDate ? 'no date' : daysLabel(ex.days)) + ' · ' + f.label));
        r.append(freshDot(f), exThumb(ex), txt);
        if (!ex.met && !isDoneToday(ex)) r.append(quickAdd(ex, true));
        return r;
      };
      shown.forEach(g => {
        const gs = sessOf(g.list);
        const gf = groupFresh(g.list);
        if (gridOpen === '*') {
          const sub = el('div', 'pt-detail-sub');
          sub.append(freshDot(gf), document.createTextNode(g.name + ' · ' + gs.done + '/' + gs.total + ' · ' + gf.label));
          box.append(sub);
          // What's left first, then what's done.
          g.list.filter(ex => !ex.met).concat(g.list.filter(ex => ex.met)).forEach(ex => box.append(line(ex)));
        } else {
          const left = g.list.filter(ex => !ex.met);
          const met = g.list.filter(ex => ex.met);
          if (left.length) { box.append(el('div', 'pt-detail-sub', 'Left')); left.forEach(ex => box.append(line(ex))); }
          if (met.length) { box.append(el('div', 'pt-detail-sub', 'Done')); met.forEach(ex => box.append(line(ex))); }
          if (cat === 'PT' && PT_WHY[g.name]) box.append(el('div', 'pt-detail-why', PT_WHY[g.name]));
        }
      });
      return box;
    }

    function renderPtStrip(sections) {
      const strip = document.getElementById('pt-strip');
      strip.innerHTML = '';
      const byCat = Object.fromEntries(GRID_CATS.map(c => [c, (sections.find(x => x.name === c) || { exercises: [] }).exercises]));
      if (!byCat.PT.length && !byCat.Compound.length && !byCat.Isolation.length) return;

      // Tabs: PT · Compound · Isolation, each with its session count.
      const tabs = el('div', 'grid-tabs');
      GRID_CATS.forEach(c => {
        if (!byCat[c].length) return;
        const t = sessOf(byCat[c]);
        const b = el('button', 'grid-tab' + (c === gridCat ? ' active' : ''));
        b.type = 'button';
        b.append(el('span', '', c), el('span', 'grid-tab-n', t.done + '/' + t.total));
        b.addEventListener('click', () => {
          if (c === gridCat) return;
          gridCat = c;
          gridOpen = null;
          try { localStorage.setItem('gridCat', c); } catch (e) {}
          render();
        });
        tabs.append(b);
      });
      strip.append(tabs);

      const list = byCat[gridCat];
      if (!list.length) return;
      const metAll = list.every(ex => ex.met);
      const t = sessOf(list);

      // Total line — tap for every exercise in this category, grouped.
      const line = el('button', 'pt-line pt-total' + (gridOpen === '*' ? ' open' : ''));
      line.type = 'button';
      line.title = 'Show all ' + gridCat;
      const bar = segBar(list.map(ex => Math.min(1, ex.weekDone / ex.weekTarget)), metAll ? 'all' : '');
      const count = el('span', 'pt-count', metAll ? 'all done ✓' : t.done + '/' + t.total + ' done');
      line.append(el('span', 'pt-label', gridCat + ' this week'), bar, count);
      line.addEventListener('click', () => { gridOpen = gridOpen === '*' ? null : '*'; render(); });
      strip.append(line);

      // Muscle group grid — tap a group for what's left and what's done.
      const groups = gridGroups(gridCat, list);
      const grid = el('div', 'pt-groups');
      groups.forEach(g => {
        const s2 = sessOf(g.list);
        const allMet = s2.done >= s2.total;
        const f = groupFresh(g.list);
        const row = el('button', 'pt-grp labeled ' + f.cls + (allMet ? ' met' : s2.done ? ' partial' : '')
          + (g.solo ? ' solo' : '') + (gridOpen === g.name ? ' open' : ''));
        row.type = 'button';
        row.title = g.name + ' · ' + f.label + (f.days >= 30 ? '' : ' · last ' + daysLabel(f.days));
        const name = el('span', 'pt-grp-name');
        name.append(freshDot(f), document.createTextNode((allMet ? '✓ ' : '') + g.name));
        const head = el('span', 'pt-grp-head');
        head.append(name, el('span', 'pt-grp-n', s2.done + '/' + s2.total));
        row.append(head, exLines(g.list));
        row.addEventListener('click', () => { gridOpen = gridOpen === g.name ? null : g.name; render(); });
        grid.append(row);
      });
      strip.append(grid);
      const legend = el('div', 'fresh-key');
      [['f-red', 'just done'], ['f-yellow', 'ready'], ['f-green', 'falling behind']].forEach(([c, l]) => {
        const k = el('span', '');
        k.append(freshDot({ cls: c, label: l }), document.createTextNode(l));
        legend.append(k);
      });
      const pk = el('span', 'gx-cells');
      pk.append(el('span', 'seg plan'), document.createTextNode('in Today'));
      pk.style.gap = '4px';
      pk.style.alignItems = 'center';
      legend.append(pk);
      strip.append(legend);
      if (gridOpen && (gridOpen === '*' || groups.some(g => g.name === gridOpen))) strip.append(gridDetail(gridCat, groups));
      else gridOpen = null;
    }

    // Chip tap: open the exercise's muscle group in the grid panel above and flash its row.
    function openInGrid(ex) {
      gridCat = 'PT';
      gridOpen = ex.group;
      render();
      const r = [...document.querySelectorAll('#pt-strip .pt-detail-row')].find(x => x.dataset.key === ex.key);
      if (r) { r.classList.remove('flash'); void r.offsetWidth; r.classList.add('flash'); }
    }

    function jumpTo(key) {
      if (sortMode !== 'category') setMode('category');
      const card = [...document.querySelectorAll('.section:not(.focus):not(.suggest) .ex')].find(c => c.dataset.key === key);
      if (card) flashCard(card);
    }

    function flashCard(card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      card.classList.remove('flash');
      void card.offsetWidth; // restart the animation
      card.classList.add('flash');
    }

    // ---------- Pick view (experiment, 2026-10-25) ----------
    // Simple view (internal 'pick'): Today as full cards with logging, then
    // Up next and Suggested as compact one-line rows (move between lists).
    // Header view tabs: Simple · Full.
    let view = 'full';
    try {
      view = localStorage.getItem('view') || (localStorage.getItem('pickView') === '1' ? 'pick' : 'full');
    } catch (e) {}
    // Today tab removed 2026-10-25 (nearly the same as Simple); old saved choice → Simple.
    if (view === 'today') view = 'pick';
    if (!['full', 'pick'].includes(view)) view = 'full';
    let pickView = view === 'pick';
    document.getElementById('view-tabs').addEventListener('click', e => {
      const v = e.target.dataset && e.target.dataset.view;
      if (!v || v === view) return;
      view = v;
      pickView = view === 'pick';
      try { localStorage.setItem('view', view); } catch (e) {}
      render();
      window.scrollTo(0, 0);
    });

    // Body area + specific muscle group, e.g. "Glutes/Hips · Glute Med"
    // (just "Core" when they're the same).
    const areaGroup = ex => !ex.area || ex.area === ex.group || ex.area === 'Other' ? ex.group : ex.area + ' · ' + ex.group;

    // Compact meta for Today / Up next rows (full and Pick view).
    function pvMeta(ex) {
      return ex.category + ' · ' + areaGroup(ex) + ' · ' + (ex.noDate ? 'no date' : daysLabel(ex.days));
    }

    function pvButton(label, title, fn) {
      const b = el('button', 'q-btn', label);
      b.type = 'button';
      b.title = title;
      b.addEventListener('click', fn);
      return b;
    }

    function pvRow(ex, meta, buttons) {
      const row = el('div', 'pick-row pv-row' + (isDoneToday(ex) ? ' done' : ''));
      row.dataset.key = ex.key;
      row.style.setProperty('--hue', heatHue(ex.days, ex.recoveryDays));
      const txt = el('span', 'pr-text');
      txt.append(el('span', 'pr-name', (isDoneToday(ex) ? '✓ ' : '') + ex.name), el('span', 'pr-meta', meta));
      row.append(exThumb(ex), txt);
      if (buttons.length) {
        const box = el('div', 'quick compact');
        box.append(...buttons);
        row.append(box);
      }
      return row;
    }

    function pvSection(id, cls, title, count) {
      const secEl = el('section', 'section wide ' + cls);
      secEl.id = id;
      const head = el('div', 'section-head');
      head.append(el('span', 'section-name', title), el('span', 'section-count', count));
      secEl.append(head);
      return secEl;
    }

    function pickViewSections(base, upNext) {
      const out = [];

      // Today: full cards with details + Weight/band and reps logging
      // (Julius, 2026-10-25). To do, then Done today ✓; Later / ✕ on picks.
      out.push(sectionEl({ id: 'today-sec', name: 'Today', exercises: plannedExercises(base), wide: true, focus: true,
        emptyText: 'Nothing yet — add from Suggested below.' }));

      // Up next
      const n = pvSection('next-sec', 'upnext', 'Up next', upNext.length ? String(upNext.length) : '');
      if (!upNext.length) n.append(el('p', 'empty small', 'Nothing queued.'));
      upNext.forEach(ex => n.append(pvRow(ex, pvMeta(ex), [
        pvButton('+ Today', 'Move to today', () => savePicks(movePicks([ex.key], 'today'), 'Moved to today: ' + ex.name)),
        pvButton('✕', 'Remove from Up next', () => savePicks(movePicks([ex.key], null), 'Removed: ' + ex.name)),
      ])));
      out.push(n);

      out.push(compactSuggest(base));
      return out;
    }

    // Suggested as compact one-line rows: tap to add, nothing logged here.
    // Used by Simple view and at the bottom of Today view.
    function compactSuggest(base) {
      const sug = suggestedExercises(base);
      const s = pvSection('suggest-sec', 'suggest', 'Suggested', '');
      s.append(ptOrderBlock(base));
      appendSuggestTree(s, sug, ex => pvRow(ex, pickMeta(ex), [quickAdd(ex, true)]), true);
      if (s.children.length === 2 && !s.children[1].children.length) s.append(el('p', 'empty small', 'Nothing to suggest right now.'));
      return boxGroups(s);
    }

    // One-time muscle group cleanup (GROUP_RENAMES in code.js): shown until
    // column A matches, then disappears by itself.
    function renameBanner(list) {
      const box = el('section', 'section wide rename-banner');
      const labels = [...new Set(list.map(r => r.to))];
      box.append(el('div', 'rest-line', 'Muscle group cleanup: ' + list.length + ' sheet rows get new labels in column A ('
        + labels.join(', ') + '). Nothing else changes.'));
      const btn = el('button', 'rest-edit-btn', 'Apply to sheet');
      btn.type = 'button';
      btn.addEventListener('click', () => {
        if (!confirm('Rename column A on ' + list.length + ' rows?')) return;
        btn.disabled = true;
        setStatus('Renaming…');
        google.script.run
          .withSuccessHandler(result => { data = result; render(); setStatus('Muscle groups updated'); })
          .withFailureHandler(err => { btn.disabled = false; setStatus('Error: ' + err.message); })
          .applyGroupRenames();
      });
      box.firstChild.append(' ', btn);
      return box;
    }

    // Abs subheads read top to bottom: Upper, Middle, Lower, then Obliques.
    const GROUP_RANK = { 'Upper Abs': 0, 'Middle Abs': 1, 'Lower Abs': 2, 'Obliques': 3 };

    function render() {
      const wrap = document.getElementById('groups');
      wrap.innerHTML = '';

      let sections = buildSections();
      const all = [].concat(...sections.map(s => s.exercises));
      exByKey = Object.fromEntries(all.map(ex => [ex.key, ex]));
      [...picked].forEach(k => { if (!exByKey[k]) picked.delete(k); });
      const upNext = upNextExercises(all);
      upNextKeys = new Set(upNext.map(ex => ex.key));
      todayKeys = new Set(plannedExercises(sections).map(ex => ex.key));
      renderPtStrip(sections);
      renderPickBar();
      document.body.classList.toggle('pick-view', view === 'pick');
      document.body.classList.toggle('today-view', view === 'today');
      document.querySelectorAll('#view-tabs [data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
      if (data.renames && data.renames.length) wrap.append(renameBanner(data.renames));
      if (pickView) {
        const base = buildSections();
        pickViewSections(base, upNext).forEach(n => wrap.append(n));
        setTopHeight();
        return;
      }
      if (sortMode === 'days') {
        // One list, most days since first; exercises with no date at the bottom.
        all.sort((a, b) => b.days - a.days || a.noDate - b.noDate || a.firstRow - b.firstRow);
        sections = [{ name: 'Longest since first', exercises: all, wide: true }];
      }

      // Pinned on Category and Days, as clearly separate zones: Today (plan +
      // picks, always shown, even empty), Suggested, Up next — then a divider
      // and every exercise.
      if (sortMode === 'category' || sortMode === 'days') {
        const base = buildSections();
        const planned = plannedExercises(base);
        wrap.append(whySection(base));
        wrap.append(summarySection(base));
        wrap.append(sectionEl({ id: 'today-sec', name: 'Today', exercises: planned, wide: true, focus: true,
          emptyText: 'Nothing planned yet. Tick suggestions below, or tap + Today on any exercise.' }));
        wrap.append(suggestSection(base));
        wrap.append(upNextSection(upNext));
        // Divider before every exercise, with the sort toggle on it.
        const zone = el('div', 'zone wide');
        zone.id = 'all-sec';
        zone.append(el('span', '', 'All exercises'));
        const sortBox = el('span', 'sort-toggle');
        [['category', 'Category'], ['days', 'Days']].forEach(([mode, label]) => {
          const b = el('button', sortMode === mode ? 'active' : '', label);
          b.type = 'button';
          b.addEventListener('click', () => { if (sortMode !== mode) setMode(mode); });
          sortBox.append(b);
        });
        zone.append(sortBox);
        wrap.append(zone);
        // Color key lives with the full list (the left edge of each card).
        const legend = el('div', 'legend wide');
        legend.append(el('span', '', 'Just trained'), el('div', 'bar'), el('span', '', 'Recovered'));
        wrap.append(legend);
      }
      sections.forEach(sec => wrap.append(sectionEl(sec)));
      setTopHeight();
    }

    function sectionEl(sec) {
      {
        const exercises = sec.exercises;
        const countText = sec.focus
          ? exercises.filter(isDoneToday).length + ' / ' + exercises.length + ' done'
          : weekCount(exercises) + ' this week';
        const secEl = el('section', 'section' + (sec.wide ? ' wide' : '') + (sec.focus ? ' focus' : ''));
        if (sec.id) secEl.id = sec.id;
        const head = el('div', 'section-head');
        head.append(el('span', 'section-name', sec.name), el('span', 'section-count', countText));
        secEl.append(head);

        const byGroup = sortMode === 'category' && !sec.focus;
        if (byGroup) {
          // Subheadings per muscle group (column A), groups in sheet order.
          const order = [];
          exercises.forEach(ex => { if (!order.includes(ex.group)) order.push(ex.group); });
          // Keep sheet order, but put the abs groups in GROUP_RANK order
          // within the slots they already take.
          const ranked = order.filter(g => g in GROUP_RANK);
          const sortedAbs = ranked.slice().sort((a, b) => GROUP_RANK[a] - GROUP_RANK[b]);
          order.forEach((g, i) => { if (g in GROUP_RANK) order[i] = sortedAbs.shift(); });
          order.forEach(g => {
            const list = exercises.filter(ex => ex.group === g);
            const sub = el('div', 'sub');
            sub.append(el('span', '', g), el('span', '', weekCount(list)));
            secEl.append(sub);
            list.forEach(ex => secEl.append(exerciseCard(ex, false)));
          });
        } else if (sec.focus) {
          // Today: what's left, then what's done — done items stay as a record.
          const todo = exercises.filter(ex => !isDoneToday(ex));
          const done = exercises.filter(isDoneToday);
          if (exercises.length) {
            const s1 = el('div', 'sub');
            s1.append(el('span', '', 'To do'), el('span', '', String(todo.length)));
            secEl.append(s1);
            if (!todo.length) secEl.append(el('p', 'empty small', done.length ? 'All done — nice.' : ''));
          }
          todo.forEach(ex => secEl.append(exerciseCard(ex, true)));
          if (done.length) {
            const s2 = el('div', 'sub');
            s2.append(el('span', '', 'Done today ✓'), el('span', '', String(done.length)));
            secEl.append(s2);
            done.forEach(ex => secEl.append(exerciseCard(ex, true)));
          }
        } else {
          exercises.forEach(ex => secEl.append(exerciseCard(ex, true)));
        }
        if (!exercises.length && sec.emptyText) secEl.append(el('p', 'empty small', sec.emptyText));
        return boxGroups(secEl);
      }
    }

    // Sort for the "All exercises" lists (toggle on the divider).
    function setMode(mode) {
      sortMode = mode;
      if (data) render();
    }

    // Top buttons jump to a zone, below the sticky header.
    function setTopHeight() {
      document.documentElement.style.setProperty('--top-h', document.querySelector('.top').offsetHeight + 'px');
    }
    window.addEventListener('resize', setTopHeight);

    function scrollToZone(id) {
      const target = document.getElementById(id);
      if (!target) return;
      const offset = document.querySelector('.top').offsetHeight + 8;
      window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - offset, behavior: 'smooth' });
    }
    document.querySelectorAll('.controls button').forEach(btn => {
      btn.addEventListener('click', () => scrollToZone(btn.dataset.jump));
    });

    // Highlight the zone currently under the header.
    function markZone() {
      const line = document.querySelector('.top').offsetHeight + 20;
      let current = 'today-sec';
      ['today-sec', 'suggest-sec', 'next-sec', 'all-sec'].forEach(id => {
        const n = document.getElementById(id);
        if (n && n.getBoundingClientRect().top <= line) current = id;
      });
      document.querySelectorAll('.controls button').forEach(b => b.classList.toggle('active', b.dataset.jump === current));
    }
    window.addEventListener('scroll', markZone, { passive: true });

    // ---------- Notes panel ----------
    const notesStatus = t => { document.getElementById('notes-status').textContent = t; };

    function renderNotes(notes) {
      const list = document.getElementById('notes-list');
      list.innerHTML = '';
      notesStatus(notes.length ? notes.length + ' note' + (notes.length === 1 ? '' : 's') : 'No notes yet.');
      notes.slice().reverse().forEach(n => {
        const li = el('li');
        const del = el('button', '', '✕');
        del.type = 'button';
        del.title = 'Remove';
        del.addEventListener('click', () => {
          if (!confirm('Remove this note?')) return;
          notesStatus('Removing…');
          google.script.run.withSuccessHandler(renderNotes)
            .withFailureHandler(err => notesStatus('Error: ' + err.message))
            .removeNote(n.i, n.text);
        });
        li.append(el('span', '', n.text), del);
        list.append(li);
      });
    }

    function openNotes() {
      document.body.classList.add('notes-open');
      notesStatus('Loading…');
      google.script.run.withSuccessHandler(renderNotes)
        .withFailureHandler(err => notesStatus('Error: ' + err.message))
        .getNotes();
    }

    const closeNotes = () => document.body.classList.remove('notes-open');
    // Notes button removed from the header (2026-10-25); panel code kept.
    const notesBtn = document.getElementById('notes-open');
    if (notesBtn) notesBtn.addEventListener('click', openNotes);
    document.getElementById('notes-close').addEventListener('click', closeNotes);
    document.getElementById('notes-shade').addEventListener('click', closeNotes);
    document.getElementById('notes-form').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('notes-input');
      const text = input.value.trim();
      if (!text) return;
      notesStatus('Saving…');
      google.script.run
        .withSuccessHandler(notes => { input.value = ''; renderNotes(notes); })
        .withFailureHandler(err => notesStatus('Error: ' + err.message))
        .addNote(text);
    });

    // Load the sheet data.
    function loadData() {
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spin');
      const done = () => btn.classList.remove('spin');
      google.script.run
        .withSuccessHandler(result => {
          data = result;
          setStatus(mergeDupes(sheetRows()).length + ' exercises');
          render();
          done();
        })
        .withFailureHandler(err => { setStatus('Error: ' + err.message); done(); })
        .getTrackerData();
    }
    // ↻ next to the title = full page reload (picks up new deploys too). It's a
    // real target=_top link to the web app URL, since the app runs in an iframe.
    // Until the URL arrives it just reloads the data.
    // Options panel (⋯ top right): PT spread count, remembered per device.
    const optPanel = document.getElementById('opt-panel');
    document.getElementById('spread-n').textContent = spreadN;
    markPtMode();
    document.getElementById('opt-btn').addEventListener('click', e => { e.stopPropagation(); optPanel.hidden = !optPanel.hidden; });
    optPanel.addEventListener('click', e => {
      e.stopPropagation();
      const b = e.target.closest('[data-spread]');
      if (b) setSpreadN(spreadN + Number(b.dataset.spread));
      const m = e.target.closest('[data-ptmode]');
      if (m) setPtMode(m.dataset.ptmode);
    });
    document.addEventListener('click', () => { optPanel.hidden = true; });

    const refreshBtn = document.getElementById('refresh-btn');
    refreshBtn.addEventListener('click', e => {
      setStatus('Refreshing…');
      refreshBtn.classList.add('spin');
      if (!refreshBtn.getAttribute('href')) { e.preventDefault(); loadData(); }
    });
    // Opened through the banner-free wrapper (?wrap=1): ↻ reloads the wrapper,
    // not the bare /exec URL (which brings the Apps Script banner back).
    const WRAP_URL = 'https://simtimj.github.io/Exercise-Tracker/';
    google.script.url.getLocation(loc => {
      if (loc && loc.parameter && loc.parameter.wrap) refreshBtn.href = WRAP_URL;
      else google.script.run.withSuccessHandler(url => { if (url) refreshBtn.href = url; }).getAppUrl();
    });
    // Tell the banner-free wrapper the app loaded (it shows a fallback if this never arrives).
    try { window.top.postMessage('exercise-tracker-loaded', '*'); } catch (e) {}
    loadData();
  </script>
</body>
