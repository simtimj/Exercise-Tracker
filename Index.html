<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <style>
    :root {
      --bg: #f6f6f4;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #6b6b66;
      --border: #e3e3df;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615;
        --card: #222220;
        --text: #f0f0ec;
        --muted: #a3a39c;
        --border: #34342f;
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      max-width: 640px;
      margin-inline: auto;
    }

    @media (min-width: 900px) {
      body { max-width: 1200px; }
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    h1 { font-size: 20px; margin: 0; }

    #status { color: var(--muted); font-size: 13px; }

    .controls {
      display: flex;
      gap: 8px;
      margin: 8px 0 12px;
    }

    .controls button {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 8px;
      font-size: 14px;
    }

    .controls button.active { border-color: var(--text); font-weight: 600; }

    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .legend .bar {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, hsl(0 75% 50%), hsl(30 85% 50%), hsl(55 85% 48%), hsl(120 55% 42%));
    }

    #groups {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (min-width: 900px) {
      #groups { grid-template-columns: 1fr 1fr; }
    }

    table.section {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--text);
      font-size: 14px;
    }

    table.section th {
      text-align: left;
      padding: 6px 8px;
      border: 1px solid var(--text);
      background: var(--bg);
    }

    .section-name { font-size: 15px; font-weight: 700; }
    .section-count { float: right; font-size: 12px; font-weight: 400; color: var(--muted); }

    table.section td {
      padding: 4px 8px;
      border: 1px solid var(--border);
      vertical-align: middle;
    }

    td.days { width: 1%; text-align: center; padding: 4px 6px; }

    .ex-name { line-height: 1.25; }
    .ex-meta { font-size: 11px; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; }

    .tag {
      display: inline-block;
      padding: 0 5px;
      margin-right: 4px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 10px;
    }

    .log {
      display: flex;
      gap: 6px;
      margin: 4px 0 2px;
    }

    .log input {
      flex: 1;
      min-width: 0;
      padding: 5px 8px;
      font-size: 16px; /* 16px stops iPhone zooming in on focus */
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
    }

    .log button {
      padding: 5px 12px;
      font-size: 14px;
      border: 1px solid var(--text);
      border-radius: 6px;
      background: var(--card);
      color: var(--text);
    }

    .log button:disabled { opacity: 0.5; }

    .pill {
      display: inline-block;
      min-width: 56px;
      text-align: center;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--heat);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <header>
    <h1>Exercise Tracker</h1>
    <div id="status">Loading…</div>
  </header>

  <div class="controls">
    <button data-sort="ready" class="active">Ready first</button>
    <button data-sort="sheet">Sheet order</button>
  </div>

  <div class="legend"><span>Just trained</span><div class="bar"></div><span>Ready (30+ = long overdue)</span></div>

  <div id="groups"></div>

  <script>
    const MAX_DAYS = 30; // anything this old (or with no date) shows as "30+"
    let data = null;
    let sortMode = 'ready';

    // Apps Script turns null into undefined; treat missing dates as 30+.
    function effectiveDays(n) {
      return (n === null || n === undefined || isNaN(n)) ? MAX_DAYS : Math.min(n, MAX_DAYS);
    }

    // 0 = just trained (red) → 1+ = recovered (green).
    function heatColor(days, recoveryDays) {
      const t = Math.max(0, Math.min(1, days / recoveryDays));
      const hue = t * 120;
      const light = 50 - t * 8;
      return `hsl(${hue.toFixed(0)} 75% ${light.toFixed(0)}%)`;
    }

    function daysLabel(n) {
      if (n >= MAX_DAYS) return MAX_DAYS + '+ days';
      if (n === 0) return 'today';
      if (n === 1) return '1 day';
      return n + ' days';
    }

    // Most overdue first: how far past its recovery time, then sheet order.
    function readiness(ex) {
      return ex.days / ex.recoveryDays;
    }

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    // Flatten groups into sections (PT, Compound, Iso…) in sheet order.
    function buildSections() {
      const all = [];
      data.groups.forEach(g => g.exercises.forEach(ex =>
        all.push(Object.assign({ group: g.name, recoveryDays: g.recoveryDays }, ex,
          { days: effectiveDays(ex.daysSince) }))));
      all.sort((a, b) => a.row - b.row);

      const sections = [];
      const byName = {};
      all.forEach(ex => {
        const name = ex.section || 'Other';
        if (!byName[name]) {
          byName[name] = { name, exercises: [] };
          sections.push(byName[name]);
        }
        byName[name].exercises.push(ex);
      });
      return sections;
    }

    // One box per exercise: type sets like "15,15,15", tap Log.
    function logBox(ex) {
      const form = el('form', 'log');
      const input = el('input');
      input.placeholder = 'Sets, e.g. 15,15,15';
      input.enterKeyHint = 'done';
      const btn = el('button', '', 'Log');
      btn.type = 'submit';
      form.append(input, btn);
      form.addEventListener('submit', e => {
        e.preventDefault();
        const entry = input.value.trim();
        if (!entry && !confirm('Mark "' + ex.name + '" done today with no sets?')) return;
        btn.disabled = true;
        btn.textContent = '…';
        setStatus('Saving ' + ex.name + '…');
        google.script.run
          .withSuccessHandler(result => {
            data = result;
            render();
            setStatus('Logged ' + ex.name);
          })
          .withFailureHandler(err => {
            btn.disabled = false;
            btn.textContent = 'Log';
            setStatus('Error: ' + err.message);
          })
          .logExercise(ex.row, ex.name, entry);
      });
      return form;
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function render() {
      const wrap = document.getElementById('groups');
      wrap.innerHTML = '';

      buildSections().forEach(sec => {
        const exercises = sec.exercises.slice();
        if (sortMode === 'ready') exercises.sort((a, b) => readiness(b) - readiness(a) || a.row - b.row);

        const table = el('table', 'section');
        const head = table.createTHead().insertRow();
        const th = el('th');
        th.colSpan = 2;
        th.append(el('span', 'section-name', sec.name),
          el('span', 'section-count', exercises.length + ' exercises'));
        head.append(th);

        const body = table.createTBody();
        exercises.forEach(ex => {
          const row = body.insertRow();
          const main = row.insertCell();
          main.append(el('div', 'ex-name', ex.name));
          const meta = el('div', 'ex-meta');
          meta.append(el('span', 'tag', ex.group));
          const detail = [ex.dateText, (ex.sets || []).slice(0, 3).join(' / ')].filter(Boolean).join(' · ');
          if (detail) meta.append(document.createTextNode(detail));
          main.append(meta, logBox(ex));

          const cell = row.insertCell();
          cell.className = 'days';
          const pill = el('span', 'pill', daysLabel(ex.days));
          pill.style.setProperty('--heat', heatColor(ex.days, ex.recoveryDays));
          cell.append(pill);
        });

        wrap.append(table);
      });
    }

    document.querySelectorAll('.controls button').forEach(btn => {
      btn.addEventListener('click', () => {
        sortMode = btn.dataset.sort;
        document.querySelectorAll('.controls button').forEach(b => b.classList.toggle('active', b === btn));
        if (data) render();
      });
    });

    google.script.run
      .withSuccessHandler(result => {
        data = result;
        const count = result.groups.reduce((n, g) => n + g.exercises.length, 0);
        document.getElementById('status').textContent = `${count} exercises`;
        render();
      })
      .withFailureHandler(err => {
        document.getElementById('status').textContent = 'Error: ' + err.message;
      })
      .getTrackerData();
  </script>
</body>

</html>
