<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <style>
    :root {
      --bg: #f6f6f4;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #6b6b66;
      --border: #e3e3df;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615;
        --card: #222220;
        --text: #f0f0ec;
        --muted: #a3a39c;
        --border: #34342f;
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      max-width: 640px;
      margin-inline: auto;
    }

    @media (min-width: 900px) {
      body { max-width: 1200px; }
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    h1 { font-size: 20px; margin: 0; }

    #status { color: var(--muted); font-size: 13px; }

    .controls {
      display: flex;
      gap: 8px;
      margin: 8px 0 12px;
    }

    .controls button {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 8px;
      font-size: 14px;
    }

    .controls button.active { border-color: var(--text); font-weight: 600; }

    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .legend .bar {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, hsl(0 75% 50%), hsl(30 85% 50%), hsl(55 85% 48%), hsl(120 55% 42%));
    }

    #groups {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (min-width: 900px) {
      #groups { grid-template-columns: 1fr 1fr; }
      #groups table.wide { grid-column: 1 / -1; }
    }

    table.section {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--text);
      font-size: 14px;
    }

    table.section th {
      text-align: left;
      padding: 6px 8px;
      border: 1px solid var(--text);
      background: var(--bg);
    }

    .section-name { font-size: 15px; font-weight: 700; }
    .section-count { float: right; font-size: 12px; font-weight: 400; color: var(--muted); }

    table.section td {
      padding: 4px 8px;
      border: 1px solid var(--border);
      vertical-align: middle;
    }

    td.days { width: 1%; text-align: center; padding: 4px 6px; }

    .ex-name { line-height: 1.25; }
    .ex-meta { font-size: 11px; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; }

    .tag {
      display: inline-block;
      padding: 0 5px;
      margin-right: 4px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 10px;
    }

    .log {
      display: flex;
      gap: 6px;
      margin: 4px 0 2px;
    }

    .log input {
      flex: 1;
      min-width: 0;
      padding: 5px 8px;
      font-size: 16px; /* 16px stops iPhone zooming in on focus */
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
    }

    tr.sub td {
      background: var(--bg);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-top: 2px solid var(--text);
    }

    .empty { color: var(--muted); text-align: center; padding: 24px 0; grid-column: 1 / -1; }

    .log input.weight { flex: 0 0 5.5em; }

    .log button {
      padding: 5px 12px;
      font-size: 14px;
      border: 1px solid var(--text);
      border-radius: 6px;
      background: var(--card);
      color: var(--text);
    }

    .log button:disabled { opacity: 0.5; }

    /* Whole exercise box takes its heat color; mixed with the card color
       just enough to keep the text readable in light and dark mode. */
    tr.ex-row td {
      background: color-mix(in srgb, var(--heat) 55%, var(--card));
      border-color: color-mix(in srgb, var(--heat) 70%, var(--text));
    }
    tr.ex-row .ex-meta { color: var(--text); opacity: 0.75; }
    tr.ex-row .tag { border-color: currentColor; }

    /* Focus table: today's plan pinned above every list. */
    table.section.focus { border: 2px solid var(--text); }
    table.section.focus th { background: var(--text); color: var(--bg); }
    table.section.focus th .section-count { color: var(--bg); opacity: 0.8; }
    tr.ex-row.done td { opacity: 0.55; }
    .ex-note { font-size: 12px; font-style: italic; margin-top: 2px; }

    /* Labelled boxes under each exercise: Last done, Prev, Prev 2. */
    .box {
      display: inline-block;
      padding: 1px 6px;
      margin: 2px 4px 0 0;
      border: 1px solid currentColor;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
    }
    .box b { font-weight: 600; }
    .box-line { margin-top: 2px; }

    header .notes-btn {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      color: var(--text);
      font-size: 13px;
    }

    /* Notes side panel slides in from the right. */
    #notes-shade {
      position: fixed; inset: 0; background: rgb(0 0 0 / 0.3);
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    #notes-panel {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: min(360px, 88vw);
      background: var(--card); color: var(--text);
      border-left: 1px solid var(--border);
      padding: 16px; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.2s;
      display: flex; flex-direction: column; gap: 10px;
    }
    body.notes-open #notes-shade { opacity: 1; pointer-events: auto; }
    body.notes-open #notes-panel { transform: none; }
    #notes-panel .panel-head { display: flex; justify-content: space-between; align-items: center; }
    #notes-panel h2 { font-size: 17px; margin: 0; }
    #notes-panel textarea {
      width: 100%; min-height: 70px; padding: 8px;
      font: inherit; font-size: 16px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text);
    }
    #notes-panel button {
      padding: 6px 12px; font-size: 14px;
      border: 1px solid var(--text); border-radius: 6px;
      background: var(--card); color: var(--text);
    }
    #notes-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    #notes-list li {
      display: flex; gap: 8px; align-items: flex-start;
      padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
    }
    #notes-list li span { flex: 1; overflow-wrap: anywhere; }
    #notes-list li button { padding: 0 8px; border-color: var(--border); }
    #notes-status { font-size: 12px; color: var(--muted); }

    .pill {
      display: inline-block;
      min-width: 56px;
      text-align: center;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--heat);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <header>
    <h1>Exercise Tracker</h1>
    <div id="status">Loading…</div>
    <button class="notes-btn" id="notes-open" type="button">Notes</button>
  </header>

  <div class="controls">
    <button data-sort="category" class="active">Category</button>
    <button data-sort="days">Days since</button>
    <button data-sort="today">Today's exercises</button>
    <button data-sort="plan">Today's plan</button>
  </div>

  <div class="legend"><span>Just trained</span><div class="bar"></div><span>Recovered</span></div>

  <div id="groups"></div>

  <div id="notes-shade"></div>
  <aside id="notes-panel" aria-label="App notes">
    <div class="panel-head">
      <h2>App notes</h2>
      <button type="button" id="notes-close">Close</button>
    </div>
    <form id="notes-form">
      <textarea id="notes-input" placeholder="Change to make in the app…"></textarea>
      <button type="submit">Add note</button>
    </form>
    <div id="notes-status"></div>
    <ul id="notes-list"></ul>
  </aside>

  <script>
    let data = null;
    let sortMode = 'category';

    const NO_DATE_DAYS = 30; // exercises with no date count as this many days

    // Apps Script turns null into undefined; no date → NO_DATE_DAYS.
    function effectiveDays(n) {
      return (n == null || isNaN(n)) ? NO_DATE_DAYS : n;
    }

    // 0 = just trained (red) → 1+ = recovered (green).
    function heatColor(days, recoveryDays) {
      const t = Math.max(0, Math.min(1, days / recoveryDays));
      const hue = t * 120;
      const light = 50 - t * 8;
      return `hsl(${hue.toFixed(0)} 75% ${light.toFixed(0)}%)`;
    }

    function daysLabel(n) {
      if (n === 0) return 'today';
      if (n === 1) return '1 day';
      return n + ' days';
    }


    // Week runs Monday–Sunday.
    function weekStartIso() {
      const [y, m, d] = data.today.split('-').map(Number);
      const t = new Date(y, m - 1, d);
      t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
      return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
    }

    function doneThisWeek(ex) {
      return !ex.noDate && ex.lastDate >= weekStartIso();
    }

    // Weight = the leading part of a log entry when it has letters,
    // e.g. "25lbs, 30, 25" → "25lbs", "20lbx2,  18" → "20lbx2", "thk red. 40" → "thk red".
    function weightOf(entry) {
      const head = String(entry || '').split(/,|\.\s/)[0].trim().replace(/\.$/, '');
      return /[a-z]/i.test(head) ? head : '';
    }

    function baseName(name) {
      return String(name).replace(/[.\s]+$/, '').replace(/\.?\s+\d.*$/, '').trim().toLowerCase();
    }

    // Last weight used: newest entry in this row, else any row of the same exercise.
    function lastWeight(ex) {
      const fromRow = list => (list || []).map(weightOf).find(Boolean) || '';
      const own = fromRow(ex.sets);
      if (own) return own;
      const key = baseName(ex.name);
      for (const g of data.groups) for (const other of g.exercises) {
        if (baseName(other.name) === key) {
          const w = fromRow(other.sets);
          if (w) return w;
        }
      }
      return '';
    }

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    // Flatten groups into sections (PT, Compound, Iso…) in sheet order.
    // Three top categories; the sheet's Abs section lives under Isolation.
    function categoryOf(section) {
      const s = String(section || '');
      if (/^pt\b/i.test(s)) return 'PT';
      if (/compound/i.test(s)) return 'Compound';
      if (/abs|isolation/i.test(s)) return 'Isolation';
      return s.split(' (')[0] || 'Other';
    }

    function buildSections() {
      const all = [];
      data.groups.forEach(g => g.exercises.forEach(ex =>
        all.push(Object.assign({ group: g.name, recoveryDays: g.recoveryDays }, ex,
          { days: effectiveDays(ex.daysSince), noDate: ex.daysSince == null }))));
      all.sort((a, b) => a.row - b.row);

      const sections = [];
      const byName = {};
      all.forEach(ex => {
        ex.category = categoryOf(ex.section);
        const name = ex.category;
        if (!byName[name]) {
          byName[name] = { name, exercises: [] };
          sections.push(byName[name]);
        }
        byName[name].exercises.push(ex);
      });
      return sections;
    }

    // One box per exercise: type sets like "15,15,15", tap Log.
    function logBox(ex) {
      const form = el('form', 'log');
      const weight = el('input', 'weight');
      weight.placeholder = 'Weight';
      weight.value = (ex.plan && ex.plan.weight) || lastWeight(ex);
      const input = el('input');
      input.placeholder = 'Sets, e.g. 15,15,15';
      input.enterKeyHint = 'done';
      const btn = el('button', '', 'Log');
      btn.type = 'submit';
      form.append(weight, input, btn);
      form.addEventListener('submit', e => {
        e.preventDefault();
        let w = weight.value.trim();
        if (/^\d+(\.\d+)?$/.test(w)) w += 'lbs'; // plain number → pounds
        const sets = input.value.trim();
        const entry = sets ? [w, sets].filter(Boolean).join(', ') : '';
        if (!entry && !confirm('Mark "' + ex.name + '" done today with no sets?')) return;
        btn.disabled = true;
        btn.textContent = '…';
        setStatus('Saving ' + ex.name + '…');
        google.script.run
          .withSuccessHandler(result => {
            data = result;
            render();
            setStatus('Logged ' + ex.name);
          })
          .withFailureHandler(err => {
            btn.disabled = false;
            btn.textContent = 'Log';
            setStatus('Error: ' + err.message);
          })
          .logExercise(ex.row, ex.name, entry);
      });
      return form;
    }

    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function box(label, value) {
      const b = el('span', 'box');
      b.append(el('b', '', label + ': '), document.createTextNode(value));
      return b;
    }

    // "9/22 Tues | wk4/5" → Last done: 9/22 Tues · Sep wk 4/5, then the
    // last two logs as Prev / Prev 2 (column D is newest).
    function historyLine(ex) {
      const line = el('div', 'ex-meta box-line');
      const text = String(ex.dateText || '');
      const [datePart, ...rest] = text.split('|').map(t => t.trim());
      if (!ex.noDate) {
        line.append(box('Last done', datePart));
        const extra = rest.join(' | ');
        const wk = extra.match(/^wk\s*(\d)\s*\/\s*(\d)$/i);
        if (wk) line.append(box(MONTHS[Number(ex.lastDate.slice(5, 7)) - 1] + ' wk', wk[1] + ' of ' + wk[2]));
        else if (extra && extra !== 'i') line.append(document.createTextNode(extra + ' '));
      } else if (text.trim() && text.trim() !== 'i') {
        line.append(document.createTextNode(text.trim() + ' '));
      }
      const sets = (ex.sets || []).map(s => s.replace(/\s+/g, ' ').replace(/[,.\s]+$/, '')).filter(Boolean);
      if (sets[0]) line.append(box('Prev', sets[0]));
      if (sets[1]) line.append(box('Prev 2', sets[1]));
      return line.childNodes.length ? line : null;
    }

    function isDoneToday(ex) {
      return !ex.noDate && ex.lastDate === data.today;
    }

    // Plan from plan.js, matched by row (falls back to name if rows moved).
    // Keeps plan order, but anything already logged today moves to the end.
    function plannedExercises(sections) {
      const all = [].concat(...sections.map(s => s.exercises));
      const planned = (data.plan || []).map(p => {
        const ex = all.find(e => e.row === p.row && e.name === p.name) || all.find(e => e.name === p.name);
        return ex ? Object.assign({}, ex, { plan: p }) : null;
      }).filter(Boolean);
      return planned.filter(ex => !isDoneToday(ex)).concat(planned.filter(isDoneToday));
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function render() {
      const wrap = document.getElementById('groups');
      wrap.innerHTML = '';

      let sections = buildSections();
      if (sortMode === 'days') {
        // One list, most days since first; exercises with no date at the bottom.
        const all = [].concat(...sections.map(s => s.exercises));
        all.sort((a, b) => b.days - a.days || a.noDate - b.noDate || a.row - b.row);
        sections = [{ name: 'All — longest since first', exercises: all, wide: true }];
      } else if (sortMode === 'today') {
        // Everything logged today, in sheet order.
        const done = [].concat(...sections.map(s => s.exercises)).filter(ex => !ex.noDate && ex.lastDate === data.today);
        if (!done.length) {
          wrap.append(el('p', 'empty', 'Nothing logged yet today.'));
          return;
        }
        sections = [{ name: "Today's exercises", exercises: done, wide: true }];
      } else if (sortMode === 'plan') {
        const planned = plannedExercises(sections);
        if (!planned.length) {
          wrap.append(el('p', 'empty', 'No plan for today yet. Ask Claude for one.'));
          return;
        }
        sections = [{ name: "Today's plan", exercises: planned, wide: true, focus: true }];
      }

      // Focus: today's plan bubbles to the top of the Category and Days views,
      // still-to-do first, done ones sink to the bottom of the table.
      if (sortMode === 'category' || sortMode === 'days') {
        const planned = plannedExercises(sections);
        if (planned.length) sections.unshift({ name: 'Focus — today', exercises: planned, wide: true, focus: true });
      }

      sections.forEach(sec => {
        const exercises = sec.exercises;
        const countText = sortMode === 'today'
          ? exercises.length + ' done'
          : sec.focus
          ? exercises.filter(isDoneToday).length + ' / ' + exercises.length + ' done'
          : exercises.filter(doneThisWeek).length + ' / ' + exercises.length + ' done this week';
        const table = el('table', 'section' + (sec.wide ? ' wide' : '') + (sec.focus ? ' focus' : ''));
        const head = table.createTHead().insertRow();
        const th = el('th');
        th.colSpan = 2;
        th.append(el('span', 'section-name', sec.name),
          el('span', 'section-count', countText));
        head.append(th);

        const body = table.createTBody();
        // Category view: subheadings per muscle group (column A), groups in sheet order.
        let list = exercises;
        if (sortMode === 'category' && !sec.focus) {
          const order = [];
          exercises.forEach(ex => { if (!order.includes(ex.group)) order.push(ex.group); });
          list = order.flatMap(g => exercises.filter(ex => ex.group === g));
        }
        let lastGroup = null;
        list.forEach(ex => {
          if (sortMode === 'category' && !sec.focus && ex.group !== lastGroup) {
            lastGroup = ex.group;
            const groupRows = list.filter(e => e.group === ex.group);
            const sub = body.insertRow();
            sub.className = 'sub';
            const c = sub.insertCell();
            c.colSpan = 2;
            c.append(el('span', '', ex.group),
              el('span', 'section-count', groupRows.filter(doneThisWeek).length + ' / ' + groupRows.length));
          }
          const row = body.insertRow();
          const main = row.insertCell();
          main.append(el('div', 'ex-name', ex.name));
          const meta = el('div', 'ex-meta');
          if (sortMode !== 'category' || sec.focus) meta.append(el('span', 'tag', ex.category), el('span', 'tag', ex.group));
          if (ex.plan) {
            const doneToday = isDoneToday(ex);
            const target = [ex.plan.target, ex.plan.weight].filter(Boolean).join(' @ ');
            meta.append(el('span', 'tag', doneToday ? '✓ done' : 'Plan' + (target ? ': ' + target : '')));
          }
          main.append(meta);
          const history = historyLine(ex);
          if (history) main.append(history);
          if (ex.plan && ex.plan.note) main.append(el('div', 'ex-note', ex.plan.note));
          main.append(logBox(ex));

          const cell = row.insertCell();
          cell.className = 'days';
          const pill = el('span', 'pill', ex.noDate ? 'no date' : daysLabel(ex.days));
          row.className = 'ex-row' + (ex.plan && isDoneToday(ex) ? ' done' : '');
          row.style.setProperty('--heat', heatColor(ex.days, ex.recoveryDays));
          cell.append(pill);
        });

        wrap.append(table);
      });
    }

    document.querySelectorAll('.controls button').forEach(btn => {
      btn.addEventListener('click', () => {
        sortMode = btn.dataset.sort;
        document.querySelectorAll('.controls button').forEach(b => b.classList.toggle('active', b === btn));
        if (data) render();
      });
    });

    // ---------- Notes panel ----------
    const notesStatus = t => { document.getElementById('notes-status').textContent = t; };

    function renderNotes(notes) {
      const list = document.getElementById('notes-list');
      list.innerHTML = '';
      notesStatus(notes.length ? notes.length + ' note' + (notes.length === 1 ? '' : 's') : 'No notes yet.');
      notes.slice().reverse().forEach(n => {
        const li = el('li');
        const del = el('button', '', '✕');
        del.type = 'button';
        del.title = 'Remove';
        del.addEventListener('click', () => {
          if (!confirm('Remove this note?')) return;
          notesStatus('Removing…');
          google.script.run.withSuccessHandler(renderNotes)
            .withFailureHandler(err => notesStatus('Error: ' + err.message))
            .removeNote(n.i, n.text);
        });
        li.append(el('span', '', n.text), del);
        list.append(li);
      });
    }

    function openNotes() {
      document.body.classList.add('notes-open');
      notesStatus('Loading…');
      google.script.run.withSuccessHandler(renderNotes)
        .withFailureHandler(err => notesStatus('Error: ' + err.message))
        .getNotes();
    }

    const closeNotes = () => document.body.classList.remove('notes-open');
    document.getElementById('notes-open').addEventListener('click', openNotes);
    document.getElementById('notes-close').addEventListener('click', closeNotes);
    document.getElementById('notes-shade').addEventListener('click', closeNotes);
    document.getElementById('notes-form').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('notes-input');
      const text = input.value.trim();
      if (!text) return;
      notesStatus('Saving…');
      google.script.run
        .withSuccessHandler(notes => { input.value = ''; renderNotes(notes); })
        .withFailureHandler(err => notesStatus('Error: ' + err.message))
        .addNote(text);
    });

    google.script.run
      .withSuccessHandler(result => {
        data = result;
        const count = result.groups.reduce((n, g) => n + g.exercises.length, 0);
        document.getElementById('status').textContent = `${count} exercises`;
        render();
      })
      .withFailureHandler(err => {
        document.getElementById('status').textContent = 'Error: ' + err.message;
      })
      .getTrackerData();
  </script>
</body>

</html>
