<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1830">
  <title>Exercise Tracker</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1f1830; font-family: system-ui, sans-serif; color: #eee; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    #help { position: fixed; inset: 0; display: none; flex-direction: column; justify-content: center;
            gap: 14px; padding: 24px; background: #1f1830; text-align: center; line-height: 1.45; }
    #help.show { display: flex; }
    #help a, #help button { display: block; padding: 12px; border-radius: 10px; font-size: 16px;
            text-decoration: none; border: 1px solid #6b5a99; background: #2c2245; color: #fff; }
    #help small { color: #aaa; }
  </style>
</head>
<body>
  <!-- Banner-free wrapper v2 (2026-10-26): loads the Apps Script web app full screen.
       The app posts 'exercise-tracker-loaded' to this page; if that never arrives,
       Google sign-in was blocked inside the frame, so show a way out. -->
  <iframe id="app" src="__APP_URL__?wrap=1" title="Exercise Tracker" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  <div id="help">
    <div><b>The app didn't load inside the wrapper.</b><br>
      <small>Usually Google sign-in can't run inside a frame. Open the app directly once (sign in if asked), then come back here.</small></div>
    <a href="__APP_URL__" target="_top">Open app directly</a>
    <button onclick="location.reload()">Try again</button>
    <small>wrapper v2</small>
  </div>
  <script>
    let ok = false;
    addEventListener('message', e => {
      if (e.data === 'exercise-tracker-loaded') { ok = true; document.getElementById('help').classList.remove('show'); }
    });
    setTimeout(() => { if (!ok) document.getElementById('help').classList.add('show'); }, 10000);
  </script>
</body>
</html>
